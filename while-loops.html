<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>While loops practice</title>
<meta name="description" content="Scaffolded GCSE Python while loop exercises: counting, stepping, infinite loops, repeating until a target, stop values and input validation.">
<style>
:root{
  color-scheme: light;
  --surface:#f3f3f3; --surface-card:#d9f3d0; --surface-plain:#ffffff;
  --ink:#212121; --muted:#4a4a4a; --heading:#00642d; --card-border:#008741;
  --accent:#008741; --accent-deep:#00642d; --on-accent:#ffffff; --label:#8cc841;
  --mode:#e05d08; --err-ink:#9b1c1c; --err-bg:#fdecea; --err-line:#c0392b;
  --ok-bg:#e9f7e4; --gap-bg:#eef9ea;
  --font: Aptos, "Segoe UI", Arial, sans-serif;
  --display: "Aptos Display", Aptos, "Segoe UI", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5}
b,strong{font-weight:700}
code{font-family:var(--mono);font-size:.92em;background:#fff;border:1px solid #c9c9c9;border-radius:5px;padding:0 .3em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #1a5fb4;outline-offset:2px}

/* layout */
.topbar{position:sticky;top:0;z-index:10;background:var(--surface-plain);border-bottom:2px solid var(--card-border)}
.topbar-inner{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;margin:0;white-space:nowrap}
.progress{flex:1;min-width:160px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.bar{flex:1;height:12px;border-radius:6px;background:#e2e2e2;border:1px solid #b9b9b9;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pystatus{font-size:15px;padding:4px 10px;border-radius:999px;border:1px solid #9a9a9a;background:#fafafa;white-space:nowrap;display:flex;gap:6px;align-items:center}
.pystatus .dot{width:10px;height:10px;border-radius:50%;background:#9a9a9a}
.pystatus.ready .dot{background:var(--accent)}
.pystatus.offline .dot{background:var(--err-line)}
.pystatus.loading .dot{background:#d9a400}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;min-height:calc(100vh - 120px)}
nav.sections{background:var(--surface-plain);border-right:1px solid #d6d6d6;padding:16px 12px}
nav.sections ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
nav.sections button{width:100%;text-align:left;background:none;border:2px solid transparent;border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;color:var(--ink);font-size:16px}
nav.sections button:hover{background:#f0f7ed}
nav.sections button[aria-current="true"]{border-color:var(--card-border);background:var(--surface-card);font-weight:700}
.navnum{flex:none;width:28px;height:28px;border-radius:50%;background:#e2e2e2;display:grid;place-items:center;font-weight:700;font-size:14px}
.navdone .navnum{background:var(--accent);color:var(--on-accent)}
.navlabel{flex:1;line-height:1.25}
.navcount{font-size:13px;color:var(--muted);white-space:nowrap}
main{padding:24px 32px 48px;max-width:980px;width:100%}
footer.values{background:var(--accent);color:var(--on-accent);text-align:center;font-size:15px;padding:10px;border-bottom:12px solid var(--label)}

@media (max-width: 880px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.sections{border-right:none;border-bottom:1px solid #d6d6d6;padding:8px 12px;overflow-x:auto}
  nav.sections ol{flex-direction:row;gap:6px}
  nav.sections button{white-space:nowrap;padding:6px 10px}
  .navlabel,.navcount{display:none}
  nav.sections button[aria-current="true"] .navlabel{display:inline}
  main{padding:16px}
  .topbar-inner{padding:8px 12px}
}

/* headings */
.sechead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1.title{font-family:var(--display);font-size:34px;line-height:1.15;margin:0}
.kicker{color:var(--muted);font-size:15px;margin:0 0 4px}
.mode{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;border:2px solid var(--mode);border-radius:999px;padding:4px 12px 4px 8px;background:#fff}
.mode svg{flex:none}

/* cards */
.card{background:var(--surface-card);border:2px solid var(--card-border);border-radius:var(--radius);padding:20px 24px;margin-bottom:24px}
.card h2,.plain h2{color:var(--heading);font-size:22px;margin:0 0 10px}
.plain{background:var(--surface-plain);border:2px solid var(--ink);border-radius:var(--radius);padding:20px 24px;margin-bottom:24px}
.key p{margin:0 0 12px;font-size:19px}
details.key > summary{cursor:pointer;color:var(--heading);font-weight:700;font-size:22px;list-style:none;display:flex;align-items:center;gap:8px}
details.key > summary::-webkit-details-marker{display:none}
details.key > summary::before{content:"▾";display:inline-block;transition:transform .15s}
details.key:not([open]) > summary::before{transform:rotate(-90deg)}
details.key[open] > summary{margin-bottom:12px}
.example{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.example .lbl,.lbl{font-size:15px;font-weight:700;color:var(--heading);margin:0 0 4px}
@media (max-width:640px){.example{grid-template-columns:1fr}}
.parts{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.parts li{background:#fff;border:1px solid #9cc79a;border-radius:10px;padding:8px 12px;font-size:16px}
.parts code{font-weight:700}
table.rt{border-collapse:collapse;margin:4px 0 14px;background:#fff;font-size:17px}
table.rt th,table.rt td{border:1px solid var(--ink);padding:6px 12px;text-align:left}
table.rt th{background:var(--label)}
table.rt td.m{font-family:var(--mono)}
.tip{margin:12px 0 0;padding:10px 14px;background:#fff;border:1px solid #9cc79a;border-radius:10px;font-size:17px}
ul.qs{margin:6px 0 0;padding-left:1.2em;font-size:19px}

/* code display */
pre.code,pre.out{font-family:var(--mono);font-size:17px;line-height:1.55;margin:0;padding:12px 16px;border-radius:10px;overflow-x:auto;white-space:pre}
pre.code{background:#fff;border:1px solid var(--ink)}
pre.out{background:#1f2a24;color:#f1f7ef;border:1px solid #1f2a24;min-height:2.2em}
pre.out.empty{color:#b9c7b4}
.t-kw{color:#00642d;font-weight:700}
.t-bi{color:#6b21a8}
.t-str{color:#9a3412}
.t-num{color:#1d4ed8}
.t-com{color:#5b6660;font-style:italic}

/* task */
.taskhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.taskhead h2{margin:0}
.stepper{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.stepper button{width:34px;height:34px;border-radius:50%;border:2px solid #8a8a8a;background:#fff;font-weight:700;font-size:15px;color:var(--ink);display:grid;place-items:center;padding:0}
.stepper button.cur{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.stepper button.done{background:var(--accent);border-color:var(--accent);color:#fff}
.stepper button.helped{background:#fff;border-color:var(--accent);color:var(--heading)}
.stepper button.plus{border-style:dashed}
.stepper .stlabel{font-size:15px;color:var(--muted);margin-left:6px}
.tag{font-size:14px;font-weight:700;border-radius:999px;padding:2px 10px;background:#fff;border:1px solid var(--card-border);color:var(--heading)}
.plusbadge{display:inline-grid;place-items:center;min-width:40px;height:32px;padding:0 8px;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;font-size:18px}
.prompt{font-size:19px;margin:0 0 14px}
.subq{font-weight:700;margin:16px 0 8px}

.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.opt{background:#fff;border:2px solid #8a8a8a;border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.opt:hover{border-color:var(--ink)}
.opt .olabel{font-size:14px;font-weight:700;color:var(--muted)}
.opt pre{margin:0;font-family:var(--mono);font-size:16px;white-space:pre-wrap}
.opt.wrong{border-color:var(--err-line);border-style:dashed;background:#fff7f6}
.opt.wrong .olabel{color:var(--err-ink)}
.opt.right{border-color:var(--accent);border-width:3px;background:var(--ok-bg)}
.opt.right .olabel{color:var(--heading)}

.gapcode input{font-family:var(--mono);font-size:17px;padding:1px 4px;border:2px solid var(--card-border);border-radius:5px;background:var(--gap-bg);color:var(--ink);text-align:center;margin:0 1px}
.gapcode input.bad{border-color:var(--err-line);border-style:dashed;background:#fff7f6}
.gapcode input.good{border-color:var(--accent);background:#d9f3d0}

.parsons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.parsons li{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #8a8a8a;border-radius:10px;padding:6px 8px}
.parsons li.dragging{opacity:.5}
.parsons li.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.parsons .grip{cursor:grab;color:#6a6a6a;font-size:20px;padding:0 4px;user-select:none}
.parsons .pline{flex:1;font-family:var(--mono);font-size:17px;white-space:pre;overflow-x:auto}
.parsons .ind{display:inline-block;border-left:2px dotted #9cc79a}
.parsons .ctl{display:flex;gap:4px}
.parsons .ctl button{width:36px;height:34px;border-radius:8px;border:1px solid var(--ink);background:#fafafa;font-size:16px;padding:0}
.parsons .ctl button:disabled{opacity:.35;cursor:default}

table.trace{border-collapse:collapse;background:#fff;margin:8px 0}
table.trace th,table.trace td{border:1px solid var(--ink);padding:6px 10px;text-align:center}
table.trace th{background:var(--label);font-family:var(--mono);font-size:16px}
table.trace td.pass{font-size:14px;color:var(--muted);text-align:left}
table.trace input{width:90px;font-family:var(--mono);font-size:17px;text-align:center;border:2px solid var(--card-border);border-radius:5px;background:var(--gap-bg);padding:2px}
table.trace input.bad{border-color:var(--err-line);border-style:dashed;background:#fff7f6}
table.trace input.good{border-color:var(--accent);background:#d9f3d0}
table.trace .given{font-family:var(--mono);font-size:17px}
.traceout{display:flex;gap:10px;align-items:center;margin-top:10px;font-weight:700}
.traceout input{width:110px;font-family:var(--mono);font-size:17px;border:2px solid var(--card-border);border-radius:5px;background:var(--gap-bg);padding:2px 6px}
.traceout input.bad{border-color:var(--err-line);border-style:dashed}
.traceout input.good{border-color:var(--accent);background:#d9f3d0}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.twocol{grid-template-columns:1fr}}

/* editor */
.editor{display:flex;border:2px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.gutter{flex:none;padding:12px 8px 12px 10px;text-align:right;font-family:var(--mono);font-size:17px;line-height:1.55;color:#7a7a7a;background:#f4f4f4;border-right:1px solid #d0d0d0;user-select:none;overflow:hidden;white-space:pre}
.editor textarea{flex:1;border:none;outline:none;resize:vertical;padding:12px 14px;font-family:var(--mono);font-size:17px;line-height:1.55;color:var(--ink);background:#fff;white-space:pre;overflow-wrap:normal;overflow-x:auto;tab-size:4;min-height:8em}
.editor:focus-within{box-shadow:0 0 0 3px #1a5fb4}
.gutter .errline{color:#fff;background:var(--err-line);border-radius:3px;padding:0 3px}
.expected{margin-bottom:16px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{border-radius:10px;padding:9px 18px;font-weight:700;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:17px}
.btn:hover{background:#f0f0f0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep)}
.btn.quiet{border-color:#9a9a9a;font-weight:400}
.btn:disabled{opacity:.5;cursor:default}
.outwrap .lbl{color:var(--ink)}
.offline-note{background:#fff8e1;border:2px solid #b58500;border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:17px}
.paste textarea{width:100%;min-height:6em;font-family:var(--mono);font-size:16px;border:2px solid var(--ink);border-radius:10px;padding:10px}

/* feedback */
.fb{margin-top:14px}
.fb:empty{display:none}
.msg{border-radius:12px;padding:12px 16px;border:2px solid;font-size:18px}
.msg h3{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:8px}
.msg p{margin:4px 0}
.msg.ok{background:var(--ok-bg);border-color:var(--accent)}
.msg.ok h3{color:var(--heading)}
.msg.bad{background:var(--err-bg);border-color:var(--err-line)}
.msg.bad h3{color:var(--err-ink)}
.msg.info{background:#fff;border-color:#8a8a8a}
.msg .raw{font-family:var(--mono);font-size:14px;color:#5a2a2a;margin-top:6px}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media (max-width:640px){.diff{grid-template-columns:1fr}}
.diff pre{background:#fff;border:1px solid var(--ink);border-radius:8px;padding:8px 10px;margin:0;font-family:var(--mono);font-size:15px;white-space:pre;overflow-x:auto}
.diff mark{background:#ffe1dc;color:var(--err-ink);font-weight:700}
.hints{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.hint{background:#fff;border:1px solid #9cc79a;border-left-width:1px;border-radius:10px;padding:8px 12px;font-size:17px}
.hint b.hl{color:var(--heading)}
.solution{margin-top:10px}
.nav-next{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}

/* intro & summary */
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:19px}
.steps li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:17px}
table.summary{border-collapse:collapse;width:100%;background:#fff;font-size:17px}
table.summary th,table.summary td{border:1px solid var(--ink);padding:8px 12px;text-align:left}
table.summary th{background:var(--label)}
table.summary td.n{text-align:center;font-weight:700}
.bigstat{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
.bigstat div{background:#fff;border:2px solid var(--card-border);border-radius:12px;padding:10px 18px;min-width:150px}
.bigstat b{display:block;font-size:30px;color:var(--heading);font-family:var(--display)}
.stamp{font-size:15px;color:var(--muted);margin-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.keyhint{font-weight:400;font-size:16px;color:var(--ink)}
.parsons{max-width:760px}
pre.out.exp{background:#fff;color:var(--ink);border:2px dashed #6a6a6a}
h1.title:focus{outline:none}
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:start}
@media (max-width:760px){.edgrid{grid-template-columns:1fr}}
.inputs textarea{width:100%;font-family:var(--mono);font-size:17px;line-height:1.55;border:2px solid var(--card-border);border-radius:10px;background:var(--gap-bg);padding:10px 12px;resize:vertical;min-height:7em}
.inote{font-size:15px;color:var(--muted);margin:6px 0 0}
.inputs label{display:block}

</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <p class="brand">While loops</p>
    <div class="progress"><div class="bar" id="bar" role="progressbar" aria-label="Tasks completed"><span></span></div><span id="progtext"></span></div>
    <div class="pystatus loading" id="pystatus" role="status"><span class="dot" aria-hidden="true"></span><span id="pytext">Python loading…</span></div>
  </div>
</header>
<div class="layout">
  <nav class="sections" aria-label="Sections"><ol id="navlist"></ol></nav>
  <main id="main"></main>
</div>
<footer class="values">Aspiration · Respect · Kindness</footer>
<script>
/* ===== Lesson content ===== */
const SECTIONS = [
{
id: "s1", title: "Counting with while",
key: "A **while loop** repeats the indented lines **as long as its condition is True**. Python checks the condition **before** each time round. When it is False, the loop stops and the program carries on after it.",
example: `count = 1
while count <= 3:
    print("Go " + str(count))
    count = count + 1
print("Done")`,
exampleOut: "Go 1\nGo 2\nGo 3\nDone",
parts: [
  ["count = 1", "**start**: set up the variable **before** the loop."],
  ["count <= 3", "the **condition**. The loop repeats while it is True."],
  [":", "the while line **ends with a colon**."],
  ["count = count + 1", "the **update**. It changes the variable so the loop can end."]
],
tip: "A counting while loop needs three things: **start** the variable, **check** it in the condition, **change** it inside the loop.",
tasks: [
{ id: "s1-1", type: "predict", title: "Predict",
  prompt: "What will this program print?",
  code: `n = 1
while n <= 4:
    print(n)
    n = n + 1`,
  options: [
    { out: "1\n2\n3\n4", fb: "Yes. `n` is 1, 2, 3, 4. When `n` becomes 5, `5 <= 4` is False and the loop stops." },
    { out: "1\n2\n3", fb: "`<=` means **less than or equal to**, so when `n` is 4 the condition is still True." },
    { out: "1\n2\n3\n4\n5", fb: "When `n` becomes 5 the condition `5 <= 4` is False, so the loop stops **before** printing 5." },
    { out: "n\nn\nn\nn", fb: "`n` has no quotes, so it is a **variable**. print shows the number it holds." }
  ], answer: 0 },
{ id: "s1-2", type: "predict", title: "Predict",
  prompt: "Look carefully at the condition and the indentation. What will this print?",
  code: `x = 0
while x < 3:
    print("Hi")
    x = x + 1
print("Bye")`,
  options: [
    { out: "Hi\nBye\nHi\nBye\nHi\nBye", fb: "`print(\"Bye\")` is **not indented**, so it is not part of the loop. It runs once, at the end." },
    { out: "Hi\nHi\nHi\nHi\nBye", fb: "When `x` is 3, `3 < 3` is False. The loop runs for `x` = 0, 1, 2 only." },
    { out: "Hi\nHi\nHi\nBye", fb: "Yes. `x` is 0, 1, then 2: three times round. Then `Bye` once, after the loop." },
    { out: "Hi\nHi\nBye", fb: "`x` **starts at 0**, so the loop runs for 0, 1 and 2: three times." }
  ], answer: 2 },
{ id: "s1-3", type: "gap", title: "Fill the gaps",
  prompt: "Complete the program so it prints the numbers **1 to 5**.",
  code: `num = [[0]]
while num [[1]] 5[[2]]
    print(num)
    num = num [[3]] 1`,
  gaps: [ { accept: ["1"], w: 3 }, { accept: ["<="], w: 3 }, { accept: [":"], w: 2 }, { accept: ["+"], w: 2 } ],
  output: "1\n2\n3\n4\n5",
  hints: ["The first gap is the **first** number you want to print.", "5 must be printed too, so you need **less than or equal to**.", "Every while line ends with the same punctuation mark as a for line.", "The update makes `num` go **up** by 1."] },
{ id: "s1-4", type: "parsons", title: "Put in order",
  prompt: "Put the lines in order so the program prints the output shown. Drag the lines, or use the arrow buttons.",
  lines: [ ["count = 10", 0], ["while count <= 30:", 0], ["print(count)", 1], ["count = count + 10", 1], ["print(\"End\")", 0] ],
  fixedIndent: true, start: [4, 2, 0, 3, 1],
  solutions: [ [0, 1, 2, 3, 4] ],
  output: "10\n20\n30\nEnd",
  hints: ["The variable must be **set up** before the while line can check it.", "10 is printed first, so print comes **before** the update.", "`End` prints once, at the very end."] },
{ id: "s1-5", type: "code", kind: "Modify", title: "Modify",
  prompt: "Change this program so it prints **Step 1** up to **Step 6**, then **Done**.",
  starter: `count = 1
while count <= 3:
    print("Go " + str(count))
    count = count + 1
print("Done")`,
  expected: "Step 1\nStep 2\nStep 3\nStep 4\nStep 5\nStep 6\nDone",
  require: [ { re: "while\\s", msg: "Keep the while loop: it should do the repeating for you." } ],
  forbid: [ { re: "for\\s+\\w+\\s+in", msg: "A for loop would work, but practise **while** here." } ],
  hints: ["There are **two** things to change: the text inside the quotes, and the number in the condition.", "To print Step 6, the loop must still run when `count` is 6."],
  solution: `count = 1
while count <= 6:
    print("Step " + str(count))
    count = count + 1
print("Done")` },
{ id: "s1-6", type: "code", kind: "Make", title: "Make",
  prompt: "Write a program that uses a while loop to print **Hello** exactly **5 times**.",
  starter: `# Write your program here
`,
  expected: "Hello\nHello\nHello\nHello\nHello",

tip: "On this page, a program that runs for ever is **stopped after a few seconds**. In Thonny, press **Stop** or Ctrl+C. To find the bug, ask: **what changes the variable in the condition, and is it inside the loop?**",
tasks: [

{

key: "To make sure the user types something **sensible**, ask, then use a while loop that repeats **while the answer is wrong**. This is called **validation**. An **if** only checks once. A **while** keeps asking **until** the answer is valid.",
example: `age = int(input("Age: "))
while age < 11 or age > 16:
    print("Must be 11 to 16")
    age = int(input("Age: "))
print("Thank you")`,
exampleIn: ["25", "14"],
exampleOut: "Age: 25\nMust be 11 to 16\nAge: 14\nThank you",
tip: "The age is wrong if it is too small **or** too big, so the condition uses **or**: it is True if **either** test is True. `and` is True only if **both** tests are True.",
tasks: [
{ id: "s6-1", type: "predict", title: "Predict",
  prompt: "The user types **0**, then **12**, then **7**. Apart from the prompts, what does the program print?",
  code: `n = int(input("1 to 10: "))
while n < 1 or n > 10:

    n = int(input("1 to 10: "))
print("You chose " + str(n))`,

    { out: "Try again\nYou chose 12", fb: "12 is **more than 10**, so `n > 10` is True and the loop asks again." },

const $ = (s, r=document) => r.querySelector(s);
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function md(s){ // tiny markdown: **bold** and `code`

}
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()){ if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(k)); }
  return e;
}
const KW = new Set(["for","in","if","elif","else","while","def","return","and","or","not","True","False","None","import","from","break","continue"]);
const BI = new Set(["print","range","len","input","str","int","float","sum","reversed"]);
function hl(src){
  let out = ""; const re = /(#.*$)|("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|([^])/gm;
  let m;

    if (m[1]) out += '<span class="t-com">'+esc(m[1])+'</span>';
    else if (m[2]) out += '<span class="t-str">'+esc(m[2])+'</span>';
    else if (m[3]) out += '<span class="t-num">'+esc(m[3])+'</span>';
    else if (m[4]) out += KW.has(m[4]) ? '<span class="t-kw">'+m[4]+'</span>' : BI.has(m[4]) ? '<span class="t-bi">'+m[4]+'</span>' : esc(m[4]);

  let L = String(s).replace(/\r/g,"").split("\n").map(l => l.replace(/\s+$/,""));

/* ---------- Python (Pyodide in a worker) ---------- */
const PY = { status:"loading", worker:null, pending:null, seq:0, loadTimer:null };
const WORKER_SRC = `
let py = null;
const ready = (async () => {
  try {
    importScripts("${PYODIDE_BASE}pyodide.js");
    py = await loadPyodide({ indexURL: "${PYODIDE_BASE}" });
    postMessage({ type: "ready" });
  } catch (e) { postMessage({ type: "fail", msg: String(e) }); }
})();
onmessage = async (e) => {
  await ready;
  if (!py) return;
  const { id, code, inputs } = e.data;
  let out = "";
  const dec = new TextDecoder();
  const write = (buf) => { out += dec.decode(buf, { stream: true }); if (out.length > 20000) throw new Error("TOO_MUCH_OUTPUT"); return buf.length; };
  py.setStdout({ write }); py.setStderr({ write });
  const g = py.globals.get("dict")();
  let err = null;
  // input() reads from the Inputs list and echoes what was "typed", like Thonny
  const prelude = "def _make_input(q):\\n    def input(prompt=''):\\n        print(prompt, end='')\\n        if not q:\\n            print()\\n            raise EOFError('NO_MORE_INPUT')\\n        v = q.pop(0)\\n        print(v)\\n        return v\\n    return input\\n";
  try { py.runPython("exec(compile(" + JSON.stringify(prelude) + ", '<inputs>', 'exec'))\\ninput = _make_input(" + JSON.stringify((inputs || []).map(String)) + ")\\ndel _make_input", { globals: g }); }
  catch (ex) { postMessage({ type: "result", id, out: "", err: String(ex) }); return; }
  try { py.runPython(code, { globals: g }); }
  catch (ex) { err = String((ex && ex.message) || ex); }
  try { py.runPython("import sys\\nsys.stdout.flush()"); } catch (_) {}
  // drain anything still buffered (e.g. after TOO_MUCH_OUTPUT) so it can't leak into the next run
  const sink = { write: (buf) => buf.length };

  try { py.runPython("import sys\\nsys.stdout.flush()\\nsys.stderr.flush()"); } catch (_) {}
  try { g.destroy(); } catch (_) {}
  postMessage({ type: "result", id, out, err, tooMuch: out.length > 20000 });
};`;
function setPyStatus(s){ PY.status = s; refreshChrome(); document.dispatchEvent(new CustomEvent("pystatus")); }
function startPy(){
  try { if (PY.worker) PY.worker.terminate(); } catch(e){}
  setPyStatus("loading");
  let w;
  try {
    const url = URL.createObjectURL(new Blob([WORKER_SRC], { type:"text/javascript" }));
    w = new Worker(url);
  } catch(e){ setPyStatus("offline"); return; }
  PY.worker = w;
  w.onmessage = (e) => {
    const d = e.data;
    if (d.type === "ready"){ clearTimeout(PY.loadTimer); setPyStatus("ready"); }
    else if (d.type === "fail"){ clearTimeout(PY.loadTimer); setPyStatus("offline"); }
    else if (d.type === "result" && PY.pending && PY.pending.id === d.id){ const p = PY.pending; PY.pending = null; clearTimeout(p.timer); p.resolve({ ok: !d.err, out: d.out, err: d.err, tooMuch: d.tooMuch }); }
  };
  w.onerror = () => { clearTimeout(PY.loadTimer); if (PY.status === "loading") setPyStatus("offline"); };

  PY.loadTimer = setTimeout(()=>{ if (PY.status === "loading"){ try{ w.terminate(); }catch(e){} setPyStatus("offline"); } }, 60000);

function runPy(code, inputs){
  return new Promise(resolve => {

    const id = ++PY.seq;
    const timer = setTimeout(()=>{ if (PY.pending && PY.pending.id === id){ PY.pending = null; resolve({ ok:false, timeout:true, out:"" }); startPy(); } }, RUN_TIMEOUT);
    PY.pending = { id, resolve, timer };
    PY.worker.postMessage({ id, code, inputs: inputs || [] });
  });

function explainError(err, code){
  const lines = String(err).trim().split("\n");
  let lineNo = null;
  for (const l of lines){ const m = l.match(/File "<(?:exec|string|code)>", line (\d+)/); if (m) lineNo = +m[1]; }
  let last = lines[lines.length-1] || "";
  for (let i = lines.length-1; i >= 0; i--){ if (/^\w*(Error|Exception)\b/.test(lines[i])){ last = lines[i]; break; } }
  let friendly = "Something went wrong when Python ran your code.";
  for (const [re, f] of ERRS){ const m = last.match(re) || String(err).match(re); if (m){ friendly = typeof f === "function" ? f(m) : f; break; } }
  if (lineNo && code){ const src = code.split("\n")[lineNo-1] || ""; if (/=>/.test(src)) friendly = "`=>` isn't Python. For \"greater than or equal to\", write `>=` (the > comes first)."; }
  return { lineNo, last, friendly };
}

/* ---------- gap fill ---------- */
function taskGap(card, ctx){
  const t = ctx.t, r = ts(t.id);
  r.gapv = r.gapv || [];
  card.append(el("p", { class:"prompt", html: md(t.prompt) }));
  const pre = el("pre", { class:"code gapcode" });
  const inputs = [];
  t.code.split(/(\[\[\d+\]\])/).forEach(part => {
    const m = part.match(/^\[\[(\d+)\]\]$/);
    if (m){
      const gi = +m[1], g = t.gaps[gi];
      const inp = el("input", { type:"text", size: g.w || 4, "aria-label": "Gap " + (gi+1), autocomplete:"off", autocapitalize:"off", spellcheck:"false" });
      inp.value = r.gapv[gi] || "";
      inp.addEventListener("input", ()=>{ r.gapv[gi] = inp.value; inp.classList.remove("bad","good"); save(); });
      inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
      inputs[gi] = inp; pre.append(inp);
    } else { const sp = el("span"); sp.innerHTML = hl(part); pre.append(sp); }
  });
  card.append(pre);
  const box = fbBox();
  const hints = hintArea(ctx, ()=>{ t.gaps.forEach((g, i) => { inputs[i].value = g.accept[0]; r.gapv[i] = g.accept[0]; inputs[i].classList.add("good"); }); save();
    showMsg(box, "info", "Here is the answer", "<p>Read it through, then try to explain to yourself why each gap is right.</p>", outWith(t.output, ctx)); });
  function check(){
    let bad = [];
    t.gaps.forEach((g, i) => {
      const ok = g.accept.some(a => normGap(a) === normGap(inputs[i].value));
      inputs[i].classList.toggle("good", ok); inputs[i].classList.toggle("bad", !ok);
      if (!ok) bad.push(i+1);
    });
    if (!bad.length){ success(ctx, box, "<p>Your program prints:</p>", outBlock(t.output)); }
    else {
      attempt(ctx);
      const empty = bad.filter(i => !inputs[i-1].value.trim());
      showMsg(box, "bad", "Not yet", "<p>" + (bad.length === 1 ? "Gap " + bad[0] + " isn't right yet." : "Gaps " + bad.join(", ") + " aren't right yet.") + (empty.length ? " Fill in every gap." : "") + " The dashed boxes need another look.</p>");
    }
    hints.update();
  }
  card.append(el("div", { class:"btnrow" }, el("button", { class:"btn primary", onclick: check }, "Check"), hints.buttons));
  card.append(hints.node, box);
  if (isDone(t.id)){ inputs.forEach(i => i.classList.add("good")); showMsg(box, "ok", "Done", "<p>Your program prints:</p>", outBlock(t.output)); }
}
function outWith(text){ const d = el("div"); d.append(el("p", { class:"lbl" }, "It prints:"), outBlock(text)); return d; }

/* ---------- parsons ---------- */
function taskParsons(card, ctx){
  const t = ctx.t, r = ts(t.id);
  if (!r.order || r.order.length !== t.lines.length) r.order = t.start.slice();
  if (!r.indent) r.indent = t.lines.map(l => t.fixedIndent ? l[1] : 0);
  card.append(el("p", { class:"prompt", html: md(t.prompt) }));
  const ul = el("ol", { class:"parsons", "aria-label":"Program lines" });
  card.append(el("div", { class:"expected" }, el("p", { class:"lbl" }, "The program should print:"), expBlock(t.output)));
  card.append(el("p", { class:"lbl" }, "Your program"), ul);
  let dragFrom = null;
  function draw(){
    ul.innerHTML = "";
    r.order.forEach((li, pos) => {
      const ind = r.indent[li];
      const line = el("span", { class:"pline" });
      if (ind) line.append(el("span", { class:"ind", style:"width:" + (ind*2.4) + "em" }));
      const code = el("span"); code.innerHTML = hl(t.lines[li][0]); line.append(code);
      const ctl = el("span", { class:"ctl" },
        el("button", { "aria-label":"Move line up", disabled: pos === 0, onclick: ()=>move(pos, pos-1) }, "▲"),
        el("button", { "aria-label":"Move line down", disabled: pos === r.order.length-1, onclick: ()=>move(pos, pos+1) }, "▼"));
      if (!t.fixedIndent){
        ctl.append(el("button", { "aria-label":"Indent less", disabled: ind === 0, onclick: ()=>{ r.indent[li] = Math.max(0, ind-1); changed(); } }, "←"),
                   el("button", { "aria-label":"Indent more", disabled: ind >= 2, onclick: ()=>{ r.indent[li] = Math.min(2, ind+1); changed(); } }, "→"));
      }
      const item = el("li", { draggable:"true" }, el("span", { class:"grip", "aria-hidden":"true" }, "⠿"), line, ctl);
      item.addEventListener("dragstart", e => { dragFrom = pos; item.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try{ e.dataTransfer.setData("text/plain", String(pos)); }catch(_){} });
      item.addEventListener("dragend", () => { item.classList.remove("dragging"); ul.querySelectorAll(".over").forEach(x=>x.classList.remove("over")); });
      item.addEventListener("dragover", e => { e.preventDefault(); item.classList.add("over"); });
      item.addEventListener("dragleave", () => item.classList.remove("over"));
      item.addEventListener("drop", e => { e.preventDefault(); if (dragFrom != null && dragFrom !== pos) move(dragFrom, pos); dragFrom = null; });
      ul.append(item);
    });
  }
  function move(a, b){ const [x] = r.order.splice(a, 1); r.order.splice(b, 0, x); changed(b); }
  function changed(focusPos){
    save(); draw(); box.innerHTML = "";
    if (focusPos != null){ const btns = ul.children[focusPos] && ul.children[focusPos].querySelectorAll("button"); if (btns && btns.length){ (btns[0].disabled ? btns[1] : btns[0]).focus(); } }
  }
  const box = fbBox();
  const hints = hintArea(ctx, ()=>{ r.order = t.solutions[0].slice(); r.indent = t.lines.map(l => l[1]); save(); draw(); showMsg(box, "info", "Here is the answer", "<p>Read it through. Notice which line is indented, and why.</p>"); });
  function check(){
    const sol = t.solutions.find(s => s.every((v, i) => v === r.order[i]));
    const indOK = t.lines.every((l, i) => r.indent[i] === l[1]);
    if (sol && indOK){
      const prog = r.order.map(i => "    ".repeat(t.lines[i][1]) + t.lines[i][0]).join("\n");
      success(ctx, box, "<p>Your program:</p>", codeBlock(prog));
    } else {
      attempt(ctx);
      if (sol) showMsg(box, "bad", "Nearly", "<p>The <strong>order</strong> is right. Now check the <strong>indentation</strong>: which line repeats?</p>");
      else {
        const best = Math.max(...t.solutions.map(s => s.filter((v, i) => v === r.order[i]).length));
        showMsg(box, "bad", "Not yet", "<p>" + best + " of " + t.lines.length + " lines are in the right place. Think about what has to happen <strong>first</strong>.</p>");
      }
    }
    hints.update();
  }
  draw();
  card.append(el("div", { class:"btnrow" }, el("button", { class:"btn primary", onclick: check }, "Check"), hints.buttons));
  card.append(hints.node, box);
  if (isDone(t.id)) showMsg(box, "ok", "Done", "<p>This task is complete.</p>");
}

/* ---------- trace table ---------- */
function traceOK(given, accept){
  const v = String(given).trim().toLowerCase();
  const a = String(accept).trim().toLowerCase();
  if (a === "true") return ["true","t","yes","y"].includes(v);
  if (a === "false") return ["false","f","no","n"].includes(v);
  return v.replace(/\s+/g,"") === a;
}
function taskTrace(card, ctx){
  const t = ctx.t, r = ts(t.id);
  r.cells = r.cells || {};
  card.append(el("p", { class:"prompt", html: md(t.prompt) }));
  const tw = el("div", { class:"twocol" });
  const table = el("table", { class:"trace" });
  table.append(el("thead", null, el("tr", null, el("th", { scope:"col" }, "Time round"), t.columns.map(c => el("th", { scope:"col" }, c)))));
  const tb = el("tbody"); const inputs = [];
  t.rows.forEach((row, ri) => {
    const tr = el("tr", null, el("td", { class:"pass" }, ordinal(ri+1)));
    row.forEach((cell, ci) => {
      if (cell[1]) tr.append(el("td", { class:"given" }, cell[0]));
      else {
        const key = ri + "-" + ci;
        const inp = el("input", { type:"text", "aria-label": t.columns[ci] + ", " + ordinal(ri+1) + " time round", autocomplete:"off", spellcheck:"false" });
        inp.value = r.cells[key] || "";
        inp.addEventListener("input", ()=>{ r.cells[key] = inp.value; inp.classList.remove("bad","good"); save(); });
        inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
        inputs.push({ inp, accept: cell[0], key });
        tr.append(el("td", null, inp));
      }
    });
    tb.append(tr);
  });
  table.append(tb);
  const outInp = el("input", { type:"text", "aria-label":"Final output", autocomplete:"off" });
  outInp.value = r.cells.out || "";
  outInp.addEventListener("input", ()=>{ r.cells.out = outInp.value; outInp.classList.remove("bad","good"); save(); });
  tw.append(el("div", null, el("p", { class:"lbl" }, "Code"), codeBlock(t.code)), el("div", null, el("p", { class:"lbl" }, "Trace table"), table, el("label", { class:"traceout" }, "What is printed at the end?", outInp)));
  card.append(tw);
  const box = fbBox();
  const hints = hintArea(ctx, ()=>{ inputs.forEach(x => { x.inp.value = x.accept; r.cells[x.key] = x.accept; x.inp.classList.add("good"); }); outInp.value = t.outputAccept[0]; r.cells.out = outInp.value; outInp.classList.add("good"); save();
    showMsg(box, "info", "Here is the completed table", "<p>Follow it row by row against the code.</p>"); });
  function check(){
    let bad = 0;
    inputs.forEach(x => { const ok = traceOK(x.inp.value, x.accept); x.inp.classList.toggle("good", ok); x.inp.classList.toggle("bad", !ok); if (!ok) bad++; });
    const ook = t.outputAccept.some(a => traceOK(outInp.value, a)); outInp.classList.toggle("good", ook); outInp.classList.toggle("bad", !ook); if (!ook) bad++;
    if (!bad) success(ctx, box, "<p>You traced the loop correctly.</p>");
    else { attempt(ctx); showMsg(box, "bad", "Not yet", "<p>" + bad + (bad === 1 ? " box needs" : " boxes need") + " another look (the dashed ones). Work through one row at a time.</p>"); }
    hints.update();
  }
  card.append(el("div", { class:"btnrow" }, el("button", { class:"btn primary", onclick: check }, "Check"), hints.buttons));
  card.append(hints.node, box);
  if (isDone(t.id)){ inputs.forEach(x => x.inp.classList.add("good")); outInp.classList.add("good"); showMsg(box, "ok", "Done", "<p>This task is complete.</p>"); }
}
function ordinal(n){ return ["1st","2nd","3rd"][n-1] || n + "th"; }

/* ---------- code editor ---------- */
function makeEditor(initial, onChange){
  const wrap = el("div", { class:"editor" });
  const gutter = el("div", { class:"gutter", "aria-hidden":"true" });
  const ta = el("textarea", { spellcheck:"false", autocapitalize:"off", autocomplete:"off", autocorrect:"off", "aria-label":"Python code editor", wrap:"off" });
  ta.value = initial;
  wrap.append(gutter, ta);
  let errLine = null;
  function size(){
    const n = ta.value.split("\n").length;
    ta.rows = Math.max(6, n + 1);
    let g = ""; for (let i = 1; i <= Math.max(n, ta.rows); i++) g += (i === errLine ? '<span class="errline">'+i+'</span>' : i) + "\n";
    gutter.innerHTML = g;
  }
  function insert(s){
    ta.focus();
    let ok = false; try { ok = document.execCommand("insertText", false, s); } catch(e){}
    if (!ok){ ta.setRangeText(s, ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
  }
  ta.addEventListener("keydown", e => {
    const v = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
    const lineStart = v.lastIndexOf("\n", a-1) + 1;
    const lineBefore = v.slice(lineStart, a);
    if (e.key === "Tab" && !e.ctrlKey && !e.altKey && !e.metaKey){
      if (e.shiftKey){
        e.preventDefault();
        const m = v.slice(lineStart).match(/^ {1,4}/);
        if (m){ ta.setSelectionRange(lineStart, lineStart + m[0].length); insert(""); ta.setSelectionRange(Math.max(lineStart, a - m[0].length), Math.max(lineStart, b - m[0].length)); }
      } else if (a === b){ e.preventDefault(); insert("    ".slice((lineBefore.length) % 4)); }
      else { e.preventDefault(); insert("    "); }
    } else if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey){
      e.preventDefault();
      let ind = (lineBefore.match(/^ */) || [""])[0];
      if (/:\s*$/.test(lineBefore)) ind += "    ";
      insert("\n" + ind);
    } else if (e.key === "Backspace" && a === b && a > lineStart && /^ +$/.test(lineBefore) && lineBefore.length % 4 === 0){
      e.preventDefault(); ta.setSelectionRange(a-4, a); insert("");
    }
  });
  ta.addEventListener("input", ()=>{ errLine = null; size(); onChange && onChange(ta.value); });
  ta.addEventListener("scroll", ()=>{ gutter.scrollTop = ta.scrollTop; });
  size();
  return { node: wrap, get value(){ return ta.value; }, set value(v){ ta.value = v; errLine = null; size(); onChange && onChange(v); }, markLine(n){ errLine = n; size(); }, focus(){ ta.focus(); } };
}

/* ---------- code task ---------- */
function taskTests(t){ return t.tests || [{ inputs: [], expected: t.expected }]; }
function inputList(a){ return a.map(x => "<code>" + esc(x) + "</code>").join(", "); }
function taskCode(card, ctx){

      el("p", { class:"lbl", html: "For example, when the user types " + inputList(tests[0].inputs) + ", your program should print:" }),
      expBlock(tests[0].expected),
      tests.length > 1 ? el("p", { class:"inote" }, "Check will also try your program with " + (tests.length - 1) + " other set" + (tests.length > 2 ? "s" : "") + " of inputs.") : null));
  } else card.append(el("div", { class:"expected" }, el("p", { class:"lbl" }, "Your program should print:"), expBlock(tests[0].expected)));
  const offNote = el("div", { class:"offline-note", hidden: true });

  inTa.addEventListener("input", ()=>{ r.inputs = inTa.value; save(); });
  if (usesInput){
    card.append(el("div", { class:"edgrid" },
      el("div", null, el("p", { class:"lbl" }, "Your code"), ed.node),
      el("div", { class:"inputs" }, el("label", { class:"lbl", for: "inputs-" + t.id }, "Inputs (one per line)"), inTa,
        el("p", { class:"inote" }, "What the user types, in order. Run uses these."))));
  } else card.append(el("p", { class:"lbl" }, "Your code"), ed.node);
  const runBtn = el("button", { class:"btn" }, "▶ Run");
  const checkBtn = el("button", { class:"btn primary" }, "✓ Check");
  const resetBtn = el("button", { class:"btn quiet" }, "Reset code");
  const actionRow = el("div", { class:"btnrow" }, runBtn, checkBtn);
  card.append(actionRow);
  const pasteWrap = el("div", { class:"paste", hidden: true });
  const pasteTa = el("textarea", { "aria-label":"Output from Thonny", spellcheck:"false" });
  pasteTa.value = r.pasted || "";
  pasteTa.addEventListener("input", ()=>{ r.pasted = pasteTa.value; save(); });
  pasteWrap.append(el("p", { class:"lbl" }, "Paste what your program printed in Thonny:"), pasteTa);
  card.append(pasteWrap);
  const outLbl = el("p", { class:"lbl" }, "Output");
  const outWrap = el("div", { class:"outwrap" }, outLbl);
  const outPre = outBlock(""); outPre.textContent = "Press Run to see what your code prints."; outPre.classList.add("empty");
  outWrap.append(outPre);
  card.append(outWrap);
  const box = fbBox();
  const solWrap = el("div", { class:"solution" });
  const hints = hintArea(ctx, ()=>{
    solWrap.innerHTML = "";

      el("div", { class:"btnrow" }, el("button", { class:"btn", onclick: ()=>{ ed.value = t.solution; ed.focus(); } }, "Put it in the editor")));
    box.innerHTML = "";
  });
  actionRow.append(...hints.buttons, resetBtn);
  card.append(hints.node, box, solWrap);

  function modeUpdate(){
    const off = PY.status === "offline", loading = PY.status === "loading";
    runBtn.hidden = off; outWrap.hidden = off; pasteWrap.hidden = !off;
    runBtn.disabled = loading; checkBtn.disabled = loading;
    offNote.hidden = !(off || loading);
    if (off){ offNote.innerHTML = md("Python couldn't load on this computer. **Copy your code into Thonny**, run it there, then paste what it printed into the box below and press **Check**. ")
        + (usesInput ? md("When it asks, type " ) + inputList(tests[0].inputs) + ". " : "");
      offNote.append(el("button", { class:"btn quiet", onclick: startPy }, "Try loading Python again")); }
    else if (loading) offNote.innerHTML = md("Python is **loading**… Run and Check will work in a moment.");
  }
  modeUpdate();
  document.addEventListener("pystatus", modeUpdate);
  // remove listener when card leaves the page
  const obs = new MutationObserver(()=>{ if (!document.body.contains(card)){ document.removeEventListener("pystatus", modeUpdate); obs.disconnect(); } });
  obs.observe($("main"), { childList:true });

  function boxInputs(){ const L = inTa.value.replace(/\r/g, "").split("\n"); while (L.length && L[L.length-1] === "") L.pop(); return L; }
  async function execute(inputs, label){
    runBtn.disabled = checkBtn.disabled = true;
    outLbl.textContent = label || "Output";
    outPre.className = "out empty"; outPre.textContent = "Running…";

    if (res.timeout){ outPre.className = "out"; outPre.textContent = "(stopped)"; return { kind:"timeout" }; }
    outPre.className = "out" + (res.out ? "" : " empty");
    outPre.textContent = res.out || "(nothing printed)";
    if (res.tooMuch) return { kind:"toomuch" };
    if (!res.ok){
      const ex = explainError(res.err, ed.value); if (ex.lineNo) ed.markLine(ex.lineNo);
      if (/NO_MORE_INPUT/.test(res.err)){ outPre.textContent = (res.out || "").replace(/\n$/, "") + "\n(no more input)"; outPre.className = "out"; return { kind:"noinput", ex }; }
      outPre.textContent = (res.out || "") + (res.out ? "\n" : "") + ex.last; outPre.className = "out"; return { kind:"error", ex };
    }

  }
  function errorMsg(res, checking){
    if (res.kind === "timeout") showMsg(box, "bad", "Your program ran for ever", "<p>It ran for more than 6 seconds and was stopped. That usually means an <strong>infinite loop</strong>: does something inside the loop change the variable in the condition, so it can become False? Python is restarting, which takes a few seconds.</p>");
    else if (res.kind === "toomuch") showMsg(box, "bad", "Too much output", "<p>Your program printed a huge amount, so it was stopped. Is your loop running <strong>for ever</strong>? Check the update line and the condition.</p>");
    else if (res.kind === "noinput") showMsg(box, "bad", "Your program wanted more input", "<p>" + (checking ? md("Your program kept asking after the last input. Check that your loop **stops** when the user types the stop value, or a valid answer.") : md("Your program asked for more input than there is in the **Inputs** box. Add another line, or check that your loop stops when it should.")) + "</p>");
    else if (res.kind === "error") showMsg(box, "bad", "Python found an error" + (res.ex.lineNo ? " on line " + res.ex.lineNo : ""), "<p>" + md(res.ex.friendly) + "</p><p class='raw'>" + esc(res.ex.last) + "</p>");
  }
  function testLabel(x){ return x.inputs.length ? "Output, when the user types " + x.inputs.join(", ") : "Output"; }

    showMsg(box, "bad", "Not quite", which + "<p>" + diffSummary(exp, got, t.ignoreSpaces) + "</p>", diffView(normLines(fail.test.expected), normLines(fail.out), exp, got));
    hints.update();

function sameOut(expected, out, ig){ const a = normLines(expected, ig), b = normLines(out, ig); return a.length === b.length && a.every((l, i) => l === b[i]); }
function printUsesComma(code){
  const src = code.replace(/#.*$/gm, "").replace(/"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'/g, '""');
  const re = /\bprint\s*\(/g; let m;
  while ((m = re.exec(src))){
    let depth = 1;
    for (let i = m.index + m[0].length; i < src.length && depth > 0; i++){
      const c = src[i];
      if (c === "(" || c === "[") depth++;
      else if (c === ")" || c === "]") depth--;
      else if (c === "," && depth === 1) return true;
    }
  }
  return false;
}
function diffSummary(exp, got, ig){
  if (!got.length) return "Your program didn't print anything.";
  const squash = L => L.map(l => l.replace(/\s+/g, ""));
  if (!ig && exp.length === got.length && squash(exp).every((l, i) => l === squash(got)[i])) return "Nearly! Only the <strong>spaces</strong> are different. Check for a space <strong>inside the quotes</strong>, next to each +.";
  for (let i = 0; i < Math.max(exp.length, got.length); i++){
    if (exp[i] !== got[i]){
      if (i >= got.length) return "Your output stops too early: line " + (i+1) + " is missing.";
      if (i >= exp.length) return "Your program prints <strong>too many lines</strong>. Line " + (i+1) + " shouldn't be there.";
      return "Line " + (i+1) + " is different. Compare the two outputs below.";
    }
  }

}
function diffView(expRaw, gotRaw, exp, got){
  const d = el("div", { class:"diff" });
  const a = el("pre"), b = el("pre");
  const n = Math.max(expRaw.length, gotRaw.length);
  let first = -1; for (let i = 0; i < n; i++) if (exp[i] !== got[i]){ first = i; break; }
  a.innerHTML = expRaw.map((l, i) => i === first ? "<mark>" + esc(l || " ") + "</mark>" : esc(l)).join("\n");
  b.innerHTML = gotRaw.map((l, i) => i === first ? "<mark>" + esc(l || " ") + "</mark>" : esc(l)).join("\n") || "(nothing)";
  if (first >= gotRaw.length && first >= 0) b.innerHTML += "\n<mark>(missing)</mark>";
  d.append(el("div", null, el("p", { class:"lbl" }, "Should print"), a), el("div", null, el("p", { class:"lbl" }, "Your program printed"), b));
  return d;
}

}
