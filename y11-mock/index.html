<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Y11 Winter Assessment feedback</title>
<style>
:root{
  color-scheme: light;
  --surface:#f3f3f3; --surface-card:#d9f3d0; --surface-plain:#ffffff;
  --ink:#212121; --muted:#4a4a4a; --heading:#00642d; --card-border:#008741;
  --accent:#008741; --accent-deep:#00642d; --on-accent:#ffffff; --label:#8cc841;
  --mode:#e05d08; --err-ink:#9b1c1c; --err-bg:#fdecea; --err-line:#c0392b;
  --ok-bg:#e9f7e4; --gap-bg:#eef9ea;
  --font: Aptos, "Segoe UI", Arial, sans-serif;
  --display: "Aptos Display", Aptos, "Segoe UI", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5}
b,strong{font-weight:700}
code{font-family:var(--mono);font-size:.92em;background:#fff;border:1px solid #c9c9c9;border-radius:5px;padding:0 .3em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #1a5fb4;outline-offset:2px}

/* layout */
.topbar{position:sticky;top:0;z-index:10;background:var(--surface-plain);border-bottom:2px solid var(--card-border)}
.topbar-inner{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;margin:0;white-space:nowrap}
.progress{flex:1;min-width:160px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.bar{flex:1;height:12px;border-radius:6px;background:#e2e2e2;border:1px solid #b9b9b9;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pystatus{font-size:15px;padding:4px 10px;border-radius:999px;border:1px solid #9a9a9a;background:#fafafa;white-space:nowrap;display:flex;gap:6px;align-items:center}
.pystatus .dot{width:10px;height:10px;border-radius:50%;background:#9a9a9a}
.pystatus.ready .dot{background:var(--accent)}
.pystatus.offline .dot{background:var(--err-line)}
.pystatus.loading .dot{background:#d9a400}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;min-height:calc(100vh - 120px)}
nav.sections{background:var(--surface-plain);border-right:1px solid #d6d6d6;padding:16px 12px}
nav.sections ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
nav.sections button{width:100%;text-align:left;background:none;border:2px solid transparent;border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;color:var(--ink);font-size:16px}
nav.sections button:hover{background:#f0f7ed}
nav.sections button[aria-current="true"]{border-color:var(--card-border);background:var(--surface-card);font-weight:700}
.navnum{flex:none;width:28px;height:28px;border-radius:50%;background:#e2e2e2;display:grid;place-items:center;font-weight:700;font-size:14px}
.navdone .navnum{background:var(--accent);color:var(--on-accent)}
.navlabel{flex:1;line-height:1.25}
.navcount{font-size:13px;color:var(--muted);white-space:nowrap}
main{padding:24px 32px 48px;max-width:980px;width:100%}
footer.values{background:var(--accent);color:var(--on-accent);text-align:center;font-size:15px;padding:10px;border-bottom:12px solid var(--label)}

@media (max-width: 880px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.sections{border-right:none;border-bottom:1px solid #d6d6d6;padding:8px 12px;overflow-x:auto}
  nav.sections ol{flex-direction:row;gap:6px}
  nav.sections button{white-space:nowrap;padding:6px 10px}
  .navlabel,.navcount{display:none}
  nav.sections button[aria-current="true"] .navlabel{display:inline}
  main{padding:16px}
  .topbar-inner{padding:8px 12px}
}

/* headings */
.sechead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1.title{font-family:var(--display);font-size:34px;line-height:1.15;margin:0}
.kicker{color:var(--muted);font-size:15px;margin:0 0 4px}
.mode{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;border:2px solid var(--mode);border-radius:999px;padding:4px 12px 4px 8px;background:#fff}
.mode svg{flex:none}

/* cards */
.card{background:var(--surface-card);border:2px solid var(--card-border);border-radius:var(--radius);padding:20px 24px;margin-bottom:24px}
.card h2,.plain h2{color:var(--heading);font-size:22px;margin:0 0 10px}
.plain{background:var(--surface-plain);border:2px solid var(--ink);border-radius:var(--radius);padding:20px 24px;margin-bottom:24px}
.key p{margin:0 0 12px;font-size:19px}
details.key > summary{cursor:pointer;color:var(--heading);font-weight:700;font-size:22px;list-style:none;display:flex;align-items:center;gap:8px}
details.key > summary::-webkit-details-marker{display:none}
details.key > summary::before{content:"▾";display:inline-block;transition:transform .15s}
details.key:not([open]) > summary::before{transform:rotate(-90deg)}
details.key[open] > summary{margin-bottom:12px}
.example{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.example .lbl,.lbl{font-size:15px;font-weight:700;color:var(--heading);margin:0 0 4px}
@media (max-width:640px){.example{grid-template-columns:1fr}}
.parts{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.parts li{background:#fff;border:1px solid #9cc79a;border-radius:10px;padding:8px 12px;font-size:16px}
.parts code{font-weight:700}
table.rt{border-collapse:collapse;margin:4px 0 14px;background:#fff;font-size:17px}
table.rt th,table.rt td{border:1px solid var(--ink);padding:6px 12px;text-align:left}
table.rt th{background:var(--label)}
table.rt td.m{font-family:var(--mono)}
.gridwrap{margin:6px 0 14px;overflow-x:auto}
.gridwrap .lbl{margin-bottom:4px}
table.rt.grid{margin-bottom:4px}
table.rt.grid th{font-size:15px;font-weight:600;white-space:nowrap}
table.rt.grid td.corner{border:none;background:transparent}
table.rt.grid td.m{text-align:center;min-width:3.2em}
table.rt.grid td.hit{background:var(--surface-card);font-weight:700;box-shadow:inset 0 0 0 2px var(--accent)}
.tip{margin:12px 0 0;padding:10px 14px;background:#fff;border:1px solid #9cc79a;border-radius:10px;font-size:17px}
ul.qs{margin:6px 0 0;padding-left:1.2em;font-size:19px}

/* code display */
pre.code,pre.out{font-family:var(--mono);font-size:17px;line-height:1.55;margin:0;padding:12px 16px;border-radius:10px;overflow-x:auto;white-space:pre}
pre.code{background:#fff;border:1px solid var(--ink)}
pre.out{background:#1f2a24;color:#f1f7ef;border:1px solid #1f2a24;min-height:2.2em}
pre.out.empty{color:#b9c7b4}
.t-kw{color:#00642d;font-weight:700}
.t-bi{color:#6b21a8}
.t-str{color:#9a3412}
.t-num{color:#1d4ed8}
.t-com{color:#5b6660;font-style:italic}

/* task */
.taskhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.taskhead h2{margin:0}
.stepper{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.stepper button{width:34px;height:34px;border-radius:50%;border:2px solid #8a8a8a;background:#fff;font-weight:700;font-size:15px;color:var(--ink);display:grid;place-items:center;padding:0}
.stepper button.cur{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.stepper button.done{background:var(--accent);border-color:var(--accent);color:#fff}
.stepper button.helped{background:#fff;border-color:var(--accent);color:var(--heading)}
.stepper button.plus{border-style:dashed}
.stepper .stlabel{font-size:15px;color:var(--muted);margin-left:6px}
.tag{font-size:14px;font-weight:700;border-radius:999px;padding:2px 10px;background:#fff;border:1px solid var(--card-border);color:var(--heading)}
.plusbadge{display:inline-grid;place-items:center;min-width:40px;height:32px;padding:0 8px;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;font-size:18px}
.prompt{font-size:19px;margin:0 0 14px}
.subq{font-weight:700;margin:16px 0 8px}

.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.opt{background:#fff;border:2px solid #8a8a8a;border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.opt:hover{border-color:var(--ink)}
.opt .olabel{font-size:14px;font-weight:700;color:var(--muted)}
.opt pre{margin:0;font-family:var(--mono);font-size:16px;white-space:pre-wrap}
.opt.wrong{border-color:var(--err-line);border-style:dashed;background:#fff7f6}
.opt.wrong .olabel{color:var(--err-ink)}
.opt.right{border-color:var(--accent);border-width:3px;background:var(--ok-bg)}
.opt.right .olabel{color:var(--heading)}

.gapcode input{font-family:var(--mono);font-size:17px;padding:1px 4px;border:2px solid var(--card-border);border-radius:5px;background:var(--gap-bg);color:var(--ink);text-align:center;margin:0 1px}
.gapcode input.bad{border-color:var(--err-line);border-style:dashed;background:#fff7f6}
.gapcode input.good{border-color:var(--accent);background:#d9f3d0}

.parsons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.parsons li{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #8a8a8a;border-radius:10px;padding:6px 8px}
.parsons li.dragging{opacity:.5}
.parsons li.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.parsons .grip{cursor:grab;color:#6a6a6a;font-size:20px;padding:0 4px;user-select:none}
.parsons .pline{flex:1;font-family:var(--mono);font-size:17px;white-space:pre;overflow-x:auto}
.parsons .ind{display:inline-block;border-left:2px dotted #9cc79a}
.parsons .ctl{display:flex;gap:4px}
.parsons .ctl button{width:36px;height:34px;border-radius:8px;border:1px solid var(--ink);background:#fafafa;font-size:16px;padding:0}
.parsons .ctl button:disabled{opacity:.35;cursor:default}

table.trace{border-collapse:collapse;background:#fff;margin:8px 0}
table.trace th,table.trace td{border:1px solid var(--ink);padding:6px 10px;text-align:center}
table.trace th{background:var(--label);font-family:var(--mono);font-size:16px}
table.trace td.pass{font-size:14px;color:var(--muted);text-align:left}
table.trace input{width:90px;font-family:var(--mono);font-size:17px;text-align:center;border:2px solid var(--card-border);border-radius:5px;background:var(--gap-bg);padding:2px}
table.trace input.bad{border-color:var(--err-line);border-style:dashed;background:#fff7f6}
table.trace input.good{border-color:var(--accent);background:#d9f3d0}
table.trace .given{font-family:var(--mono);font-size:17px}
.traceout{display:flex;gap:10px;align-items:center;margin-top:10px;font-weight:700}
.traceout input{width:110px;font-family:var(--mono);font-size:17px;border:2px solid var(--card-border);border-radius:5px;background:var(--gap-bg);padding:2px 6px}
.traceout input.bad{border-color:var(--err-line);border-style:dashed}
.traceout input.good{border-color:var(--accent);background:#d9f3d0}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.twocol{grid-template-columns:1fr}}

/* editor */
.editor{display:flex;border:2px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.gutter{flex:none;padding:12px 8px 12px 10px;text-align:right;font-family:var(--mono);font-size:17px;line-height:1.55;color:#7a7a7a;background:#f4f4f4;border-right:1px solid #d0d0d0;user-select:none;overflow:hidden;white-space:pre}
.editor textarea{flex:1;border:none;outline:none;resize:vertical;padding:12px 14px;font-family:var(--mono);font-size:17px;line-height:1.55;color:var(--ink);background:#fff;white-space:pre;overflow-wrap:normal;overflow-x:auto;tab-size:4;min-height:8em}
.editor:focus-within{box-shadow:0 0 0 3px #1a5fb4}
.gutter .errline{color:#fff;background:var(--err-line);border-radius:3px;padding:0 3px}
.expected{margin-bottom:16px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{border-radius:10px;padding:9px 18px;font-weight:700;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:17px}
.btn:hover{background:#f0f0f0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep)}
.btn.quiet{border-color:#9a9a9a;font-weight:400}
.btn:disabled{opacity:.5;cursor:default}
.outwrap .lbl{color:var(--ink)}
.offline-note{background:#fff8e1;border:2px solid #b58500;border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:17px}
.paste textarea{width:100%;min-height:6em;font-family:var(--mono);font-size:16px;border:2px solid var(--ink);border-radius:10px;padding:10px}

/* feedback */
.fb{margin-top:14px}
.fb:empty{display:none}
.msg{border-radius:12px;padding:12px 16px;border:2px solid;font-size:18px}
.msg h3{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:8px}
.msg p{margin:4px 0}
.msg.ok{background:var(--ok-bg);border-color:var(--accent)}
.msg.ok h3{color:var(--heading)}
.msg.bad{background:var(--err-bg);border-color:var(--err-line)}
.msg.bad h3{color:var(--err-ink)}
.msg.info{background:#fff;border-color:#8a8a8a}
.msg .raw{font-family:var(--mono);font-size:14px;color:#5a2a2a;margin-top:6px}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media (max-width:640px){.diff{grid-template-columns:1fr}}
.diff pre{background:#fff;border:1px solid var(--ink);border-radius:8px;padding:8px 10px;margin:0;font-family:var(--mono);font-size:15px;white-space:pre;overflow-x:auto}
.diff mark{background:#ffe1dc;color:var(--err-ink);font-weight:700}
.hints{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.hint{background:#fff;border:1px solid #9cc79a;border-left-width:1px;border-radius:10px;padding:8px 12px;font-size:17px}
.hint b.hl{color:var(--heading)}
.solution{margin-top:10px}
.nav-next{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}

/* intro & summary */
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:19px}
.steps li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:17px}
table.summary{border-collapse:collapse;width:100%;background:#fff;font-size:17px}
table.summary th,table.summary td{border:1px solid var(--ink);padding:8px 12px;text-align:left}
table.summary th{background:var(--label)}
table.summary td.n{text-align:center;font-weight:700}
.bigstat{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
.bigstat div{background:#fff;border:2px solid var(--card-border);border-radius:12px;padding:10px 18px;min-width:150px}
.bigstat b{display:block;font-size:30px;color:var(--heading);font-family:var(--display)}
.stamp{font-size:15px;color:var(--muted);margin-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.keyhint{font-weight:400;font-size:16px;color:var(--ink)}
.parsons{max-width:760px}
pre.out.exp{background:#fff;color:var(--ink);border:2px dashed #6a6a6a}
h1.title:focus{outline:none}
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:start}
@media (max-width:760px){.edgrid{grid-template-columns:1fr}}
.inputs textarea{width:100%;font-family:var(--mono);font-size:17px;line-height:1.55;border:2px solid var(--card-border);border-radius:10px;background:var(--gap-bg);padding:10px 12px;resize:vertical;min-height:7em}
.inote{font-size:15px;color:var(--muted);margin:6px 0 0}
.inputs label{display:block}


/* ===== additions for the mock feedback site ===== */
.navnum.q{width:auto;min-width:28px;padding:0 6px;border-radius:14px;font-size:12px}
.mt{margin-top:18px}
.asked{background:#fff;border:1px solid #9cc79a;border-radius:10px;padding:10px 14px}
.asked .mx{font-weight:700;color:var(--heading)}
.teacher{background:#fff4ec;border:2px solid var(--mode);border-radius:12px;padding:10px 16px;margin:14px 0}
.teacher .tlab{margin:0 0 4px;font-weight:800;color:#a3410a;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.teacher p{margin:0}
.marksbox{background:#fff;border:1px solid #9cc79a;border-radius:10px;padding:10px 16px;margin:14px 0}
.marksbox ul{margin:4px 0 0;padding-left:1.2em}
.model{margin:14px 0}
pre.model-text{font-family:var(--font);white-space:pre-wrap;background:#fff;border:2px dashed var(--card-border);border-radius:10px;padding:12px 16px;margin:0;font-size:18px}
table.ideas td,table.ideas th{vertical-align:top;font-size:16px}
.erlwrap{margin:0 0 12px}
.erlwrap .lbl{font-size:14px}
.tag.help{background:#fff}
.tag.own{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag.plus{background:#fff;border-style:dashed}
.stepper button{width:auto;min-width:54px;padding:0 10px;border-radius:999px;font-size:14px}

/* results page */
.prio{margin:6px 0 0;padding-left:1.4em;font-size:19px}
.prio li{margin:4px 0}
.linkbtn{background:none;border:none;color:var(--heading);font-weight:700;text-decoration:underline;padding:0;font-size:inherit}
table.qla td,table.qla th{padding:6px 10px}
table.qla tr.full td{color:#555}
table.qla tr.low td:nth-child(3){background:#fde2dc;font-weight:800}
table.qla tr.part td:nth-child(3){background:#fff2cc;font-weight:800}
table.qla tr.full td:nth-child(3){background:var(--ok-bg)}
.fulltag{font-size:15px;color:var(--heading)}

/* choices */
.options.text{grid-template-columns:1fr}
.options.text .opt{flex-direction:row;align-items:center;gap:12px;font-size:18px}
.options.text .olabel{flex:none;width:30px;height:30px;border-radius:50%;background:#eee;display:grid;place-items:center;color:var(--ink)}
.options.text .opt.right .olabel{background:var(--accent);color:#fff}
.options.text .opt.wrong .olabel{background:#fbd5cf}
.checks{display:flex;flex-direction:column;gap:8px;margin:8px 0}
label.check{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid #8a8a8a;border-radius:12px;padding:10px 14px;cursor:pointer;font-size:18px}
label.check input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:var(--accent)}
label.check.wrong{border-color:var(--err-line);border-style:dashed;background:#fff7f6}
label.check.right{border-color:var(--accent);border-width:3px;background:var(--ok-bg)}
table.matcht{border-collapse:separate;border-spacing:0 8px;width:100%}
table.matcht td{background:#fff;padding:8px 12px;border-top:1px solid #c9c9c9;border-bottom:1px solid #c9c9c9;font-size:18px}
table.matcht td:first-child{border-left:1px solid #c9c9c9;border-radius:10px 0 0 10px}
table.matcht td:last-child{border-right:1px solid #c9c9c9;border-radius:0 10px 10px 0;width:1%;white-space:nowrap}
select{font:inherit;font-size:17px;padding:5px 8px;border:2px solid var(--card-border);border-radius:8px;background:var(--gap-bg);color:var(--ink)}
select.bad{border-color:var(--err-line);border-style:dashed;background:#fff7f6}
select.good{border-color:var(--accent);background:#d9f3d0}
p.gapprose{font-size:19px;line-height:2.1;background:#fff;border:1px solid var(--ink);border-radius:10px;padding:12px 16px}
p.gapprose input{font:inherit;font-size:18px;padding:1px 6px;border:2px solid var(--card-border);border-radius:6px;background:var(--gap-bg)}
p.gapprose input.bad{border-color:var(--err-line);border-style:dashed;background:#fff7f6}
p.gapprose input.good{border-color:var(--accent);background:#d9f3d0}

/* tables */
table.trace input.sm{width:56px}
table.trace input.wide{width:150px}
table.trace.exam th{font-family:var(--font)}
table.trace.exam td{padding:4px 6px}
.tracewrap{overflow-x:auto}

/* gates */
.circwrap{max-width:620px;background:#fff;border:1px solid var(--ink);border-radius:10px;padding:8px;margin:8px 0}
svg.circuit{width:100%;height:auto;display:block}
svg .wire{stroke:#212121;stroke-width:2.5}
svg .gate{fill:#fff;stroke:#212121;stroke-width:3}
svg .emptybox{fill:#eef9ea;stroke:#008741;stroke-width:2;stroke-dasharray:6 4}
svg .qmark{font:700 28px var(--font);fill:#008741}
svg .lab{font:700 22px var(--font);fill:#212121}
.gatesel{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}
.gatesel label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:16px}
.gatekey{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 14px}
.gatekey figure{margin:0;background:#fff;border:1px solid #9cc79a;border-radius:10px;padding:6px 10px;text-align:center}
.gatekey figcaption{font-size:15px;font-weight:700}

/* merge sort */
.merge{display:flex;flex-direction:column;gap:12px;margin:8px 0 14px;overflow-x:auto}
.mrow{display:flex;gap:12px;align-items:center;flex-wrap:nowrap}
.mlab{flex:none;width:110px;font-size:15px;font-weight:700;color:var(--heading)}
.mlist{display:inline-flex;border:3px solid var(--ink);border-radius:6px;background:#fff}
.mcell{display:inline-grid;place-items:center;min-width:46px;height:40px;font-family:var(--mono);font-size:17px;border-right:1px solid #9a9a9a;padding:0 4px}
.mlist .mcell:last-child{border-right:none}
input.mcell{width:52px;border:none;border-right:1px solid #9a9a9a;background:var(--gap-bg);text-align:center;border-radius:0}
input.mcell.bad{background:#fde2dc;outline:2px dashed var(--err-line)}
input.mcell.good{background:#d9f3d0}

/* sql, essay */
.sqlout{margin-top:10px;overflow-x:auto}
.examq{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 16px;margin-bottom:12px}
textarea.essay{width:100%;min-height:20em;font-family:var(--font);font-size:18px;line-height:1.5;border:2px solid var(--ink);border-radius:10px;padding:12px}
.levels{display:flex;flex-direction:column;gap:8px}
label.lvl{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid #8a8a8a;border-radius:12px;padding:8px 14px;cursor:pointer}
label.lvl b{flex:none;width:100px}
label.lvl input{width:20px;height:20px;accent-color:var(--accent)}

/* finish */
.ccode{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.06em;background:#fff;border:3px solid var(--accent);border-radius:12px;padding:12px 18px;display:inline-block;margin:6px 0;user-select:all;word-break:break-all}

/* login */
body.loggedout nav.sections,body.loggedout .progress{visibility:hidden}
body.loggedout .layout{grid-template-columns:minmax(0,1fr)}
body.loggedout nav.sections{display:none}
.login{max-width:560px;margin:40px auto}
.lbl.big{font-size:20px}
#codein{font-family:var(--mono);font-size:30px;width:4.5em;text-transform:uppercase;text-align:center;letter-spacing:.2em;border:3px solid var(--card-border);border-radius:10px;padding:4px 8px}

@media print{ nav.sections,.topbar,footer{display:none} }

.stack{display:flex;flex-direction:column;gap:12px}
.stack .erlwrap{max-width:640px}
.twocol > div{min-width:0}
@media (max-width:640px){
  table.matcht td:last-child{white-space:normal}
  table.matcht select{max-width:9.5em}
  table.trace input{width:70px} table.trace input.sm{width:40px} table.trace input.wide{width:110px}
}

/* hex grid */
.hexwrap{background:#fff;border:1px solid var(--ink);border-radius:10px;padding:10px 14px;margin:8px 0;overflow-x:auto}
.hexq{margin:0 0 6px;font-size:19px}
table.hexg{border-collapse:collapse;font-family:var(--mono)}
table.hexg th,table.hexg td{width:46px;text-align:center;padding:2px}
table.hexg tr.hh th{background:var(--label);border:1px solid #6a6a6a;font-size:15px;padding:4px 0}
table.hexg td{border:1px solid #6a6a6a;height:40px}
table.hexg tr.arrows td{border:none;height:18px;color:var(--heading);font-weight:700;font-size:14px}
table.hexg tr.digits td{border:none;font-family:var(--font);font-weight:800;font-size:17px;color:var(--heading);border-top:3px solid var(--heading)}
table.hexg .split{border-left:6px solid #fff}
table.hexg tr.digits td.split{border-left:6px solid #fff}
.bit{font-size:19px;font-weight:700}
.bit.one{background:#d9f3d0;display:block;line-height:36px}
input.bitin{width:38px;height:34px;text-align:center;font-family:var(--mono);font-size:19px;border:2px solid var(--card-border);border-radius:6px;background:var(--gap-bg)}
input.bitin.bad,input.hexans.bad{border-color:var(--err-line);border-style:dashed;background:#fff7f6}
input.bitin.good,input.hexans.good{border-color:var(--accent);background:#d9f3d0}
input.hexans{width:80px;font-family:var(--mono);font-size:19px;padding:3px 6px;border:2px solid var(--card-border);border-radius:6px;background:var(--gap-bg)}
.hexsum{margin:8px 0 0;font-size:18px}
.altbox{background:#fff;border:2px dashed var(--accent);border-radius:12px;padding:8px 14px;margin:10px 0}
.altbox .tlab{margin:0 0 2px;font-weight:800;color:var(--heading)}
.altbox p{margin:0}
</style>
</head>

  asked:"Explain why the computer is more efficient after defragmentation.",
  how:[
    "Over time, parts of files get split up and stored in different places on a hard disk.",
    "Defragmentation moves the parts of each file **next to each other** (contiguous), and puts the **free space together**.",

    "**Writing:** there are large blocks of free space, so new files **don't need to be split**, so **saving is faster**."

/* ---------- Python (Pyodide in a worker) ---------- */
const PY = { status:"idle", worker:null, pending:null, seq:0, loadTimer:null };
const WORKER_SRC = `
let py = null;
const ready = (async () => {
  try {
    importScripts("${PYODIDE_BASE}pyodide.js");
    py = await loadPyodide({ indexURL: "${PYODIDE_BASE}" });
    postMessage({ type: "ready" });
  } catch (e) { postMessage({ type: "fail", msg: String(e) }); }
})();
onmessage = async (e) => {
  await ready;
  if (!py) return;
  const { id, code, inputs } = e.data;
  let out = "";
  const dec = new TextDecoder();
  const write = (buf) => { out += dec.decode(buf, { stream: true }); if (out.length > 20000) throw new Error("TOO_MUCH_OUTPUT"); return buf.length; };
  py.setStdout({ write }); py.setStderr({ write });
  const g = py.globals.get("dict")();
  let err = null;
  const prelude = "def _make_input(q):\\n    def input(prompt=''):\\n        print(prompt, end='')\\n        if not q:\\n            print()\\n            raise EOFError('NO_MORE_INPUT')\\n        v = q.pop(0)\\n        print(v)\\n        return v\\n    return input\\n";
  try { py.runPython("exec(compile(" + JSON.stringify(prelude) + ", '<inputs>', 'exec'))\\ninput = _make_input(" + JSON.stringify((inputs || []).map(String)) + ")\\ndel _make_input", { globals: g }); }
  catch (ex) { postMessage({ type: "result", id, out: "", err: String(ex) }); return; }
  try { py.runPython(code, { globals: g }); }
  catch (ex) { err = String((ex && ex.message) || ex); }
  try { py.runPython("import sys\\nsys.stdout.flush()"); } catch (_) {}
  const sink = { write: (buf) => buf.length };
  py.setStdout(sink); py.setStderr(sink);
  try { py.runPython("import sys\\nsys.stdout.flush()\\nsys.stderr.flush()"); } catch (_) {}
  try { g.destroy(); } catch (_) {}
  postMessage({ type: "result", id, out, err, tooMuch: out.length > 20000 });
};`;
function needsPy(){ return ALL.some(x => x.t.type === "code"); }
function setPyStatus(s){ PY.status = s; refreshChrome(); document.dispatchEvent(new CustomEvent("pystatus")); }
function startPy(){
  try { if (PY.worker) PY.worker.terminate(); } catch(e){}
  setPyStatus("loading");
  let w;
  try { const url = URL.createObjectURL(new Blob([WORKER_SRC], { type:"text/javascript" })); w = new Worker(url); }
  catch(e){ setPyStatus("offline"); return; }
  PY.worker = w;
  w.onmessage = (e) => {
    const d = e.data;
    if (d.type === "ready"){ clearTimeout(PY.loadTimer); setPyStatus("ready"); }
    else if (d.type === "fail"){ clearTimeout(PY.loadTimer); setPyStatus("offline"); }
    else if (d.type === "result" && PY.pending && PY.pending.id === d.id){ const p = PY.pending; PY.pending = null; clearTimeout(p.timer); p.resolve({ ok: !d.err, out: d.out, err: d.err, tooMuch: d.tooMuch }); }
  };
  w.onerror = () => { clearTimeout(PY.loadTimer); if (PY.status === "loading") setPyStatus("offline"); };
  clearTimeout(PY.loadTimer);
  PY.loadTimer = setTimeout(()=>{ if (PY.status === "loading"){ try{ w.terminate(); }catch(e){} setPyStatus("offline"); } }, 60000);
}
function runPy(code, inputs){
  return new Promise(resolve => {
    if (PY.status !== "ready" || !PY.worker){ resolve({ ok:false, offline:true }); return; }
    const id = ++PY.seq;
    const timer = setTimeout(()=>{ if (PY.pending && PY.pending.id === id){ PY.pending = null; resolve({ ok:false, timeout:true, out:"" }); startPy(); } }, RUN_TIMEOUT);
    PY.pending = { id, resolve, timer };
    PY.worker.postMessage({ id, code, inputs: inputs || [] });
  });
}

function explainError(err, code){
  const lines = String(err).trim().split("\n");
  let lineNo = null;
  for (const l of lines){ const m = l.match(/File "<(?:exec|string|code)>", line (\d+)/); if (m) lineNo = +m[1]; }
  let last = lines[lines.length-1] || "";
  for (let i = lines.length-1; i >= 0; i--){ if (/^\w*(Error|Exception)\b/.test(lines[i])){ last = lines[i]; break; } }
  let friendly = "Something went wrong when Python ran your code.";
  for (const [re, f] of ERRS){ const m = last.match(re) || String(err).match(re); if (m){ friendly = typeof f === "function" ? f(m) : f; break; } }
  if (lineNo && code && lineNo > code.split("\n").length) lineNo = null;
  return { lineNo, last, friendly };
}

/* ---------- shared task bits ---------- */
function fbBox(){ return el("div", { class:"fb", "aria-live":"polite" }); }
function showMsg(box, kind, title, bodyHtml, extra){
  box.innerHTML = "";
  const m = el("div", { class:"msg " + kind }, el("h3", null, kind === "ok" ? "✓ " + title : kind === "bad" ? "✗ " + title : title));
  if (bodyHtml) m.append(el("div", { html: bodyHtml }));
  if (extra) m.append(extra);
  box.append(m);
}
function success(ctx, box, bodyHtml, extra){
  setStatus(ctx.t.id, "done");
  const nb = el("button", { class:"btn primary", onclick: ()=>next(ctx) }, nextLabel(ctx));
  const wrap = el("div", null); if (extra) wrap.append(extra); wrap.append(el("div", { class:"btnrow" }, nb));
  showMsg(box, "ok", ctx.t.role === "plus" ? "Challenge complete!" : pick(["Correct!", "Well done!", "Spot on!", "That's the marks!"]), bodyHtml, wrap);
  const sk = $("#skipbtn"); if (sk) sk.textContent = nextLabel(ctx);

}
function refreshStepper(ctx){
  const btns = document.querySelectorAll(".stepper button");
  ctx.s.tasks.forEach((tt, i) => { const r = state.tasks[tt.id] || {}; if (btns[i]){ btns[i].classList.toggle("done", r.status === "done"); btns[i].classList.toggle("helped", r.status === "helped"); } });
}
function attempt(ctx){ const r = ts(ctx.t.id); r.attempts = (r.attempts||0) + 1; save(); return r.attempts; }
function hintArea(ctx, revealFn){
  const t = ctx.t, r = ts(t.id);
  const list = el("div", { class:"hints" });
  const hints = t.hints || [];
  const hb = el("button", { class:"btn quiet" });
  const ab = el("button", { class:"btn quiet", hidden: true }, "Show me an answer");
  function draw(){
    list.innerHTML = "";
    for (let i = 0; i < Math.min(r.hints||0, hints.length); i++) list.append(el("div", { class:"hint", html: "<b class='hl'>Hint " + (i+1) + ":</b> " + md(hints[i]) }));
    hb.textContent = (r.hints||0) < hints.length ? "Show a hint (" + ((r.hints||0)+1) + " of " + hints.length + ")" : "No more hints";
    hb.disabled = (r.hints||0) >= hints.length;
    hb.hidden = hints.length === 0;
    ab.hidden = !(revealFn && (r.attempts||0) >= 3 && !r.revealed);
  }
  hb.onclick = () => { r.hints = Math.min((r.hints||0)+1, hints.length); save(); draw(); };
  ab.onclick = () => { r.revealed = true; setStatus(t.id, "helped"); save(); revealFn(); draw(); refreshStepper(ctx); const sk = $("#skipbtn"); if (sk) sk.textContent = nextLabel(ctx); };
  draw();
  return { node: list, buttons: [hb, ab], update: draw };
}
function promptBits(card, t){

}
function checkRow(card, check, hints){ card.append(el("div", { class:"btnrow" }, el("button", { class:"btn primary", onclick: check }, "Check"), hints.buttons)); }

/* ---------- single choice ---------- */
function taskChoice(card, ctx){
  const t = ctx.t, r = ts(t.id);
  promptBits(card, t);
  if (t.code) card.append(t.erl ? erlBlock(t.code) : codeBlock(t.code));
  const box = fbBox();
  const grid = el("div", { class:"options text", role:"group", "aria-label":"Choices" });
  r.wrong = r.wrong || [];
  t.options.forEach((o, i) => {
    const b = el("button", { class:"opt" }, el("span", { class:"olabel" }, "ABCDEF"[i]), el("span", { class:"otext", html: md(o.t) }));
    if (r.wrong.includes(i)) b.classList.add("wrong");
    if (isDone(t.id) && i === t.answer) b.classList.add("right");
    b.onclick = () => {
      if (i === t.answer){ b.classList.add("right"); success(ctx, box, md(o.fb || "")); }
      else { attempt(ctx); if (!r.wrong.includes(i)) r.wrong.push(i); save(); b.classList.add("wrong"); showMsg(box, "bad", "Not this one", md(o.fb || "") + "<p>Try again.</p>"); }
    };

  });

/* ---------- multi select ---------- */
function taskMulti(card, ctx){
  const t = ctx.t, r = ts(t.id);
  r.sel = r.sel || [];
  promptBits(card, t);
  const box = fbBox();
  const list = el("div", { class:"checks", role:"group" });
  const boxes = t.options.map((o, i) => {
    const cb = el("input", { type:"checkbox", id: t.id + "-c" + i });
    cb.checked = r.sel.includes(i);
    cb.addEventListener("change", ()=>{ r.sel = boxes.map((b, k) => b.checked ? k : -1).filter(k => k >= 0); save(); lab.classList.remove("wrong","right"); });
    const lab = el("label", { class:"check", for: t.id + "-c" + i }, cb, el("span", { html: md(o.t) }));
    list.append(lab);
    return cb;
  });
  card.append(list);
  const labs = () => list.querySelectorAll("label.check");
  const hints = hintArea(ctx, ()=>{
    boxes.forEach((b, i) => { b.checked = isOk(t.options[i]) && (t.dimRule ? solutionPick().includes(i) : true); });
    r.sel = boxes.map((b, k) => b.checked ? k : -1).filter(k => k >= 0); save();
    showMsg(box, "info", "Here is an answer", "<p>Read why each ticked answer gets a mark.</p>");
  });
  function isOk(o){ return o.ok === true || o.ok === "dim"; }
  function solutionPick(){ const out = []; let dims = 0; t.options.forEach((o, i) => { if (o.ok === "dim" && dims < 1){ out.push(i); dims++; } else if (o.ok === true && out.length < (t.exact || 99)) out.push(i); }); return out.slice(0, t.exact || 99); }
  function check(){
    const sel = boxes.map((b, i) => b.checked ? i : -1).filter(i => i >= 0);
    labs().forEach(l => l.classList.remove("wrong","right"));
    if (!sel.length){ showMsg(box, "bad", "Nothing ticked", "<p>Tick the answers you think are right.</p>"); return; }
    let msgs = [];
    const wrongSel = sel.filter(i => !isOk(t.options[i]));
    wrongSel.forEach(i => { labs()[i].classList.add("wrong"); if (t.options[i].fb) msgs.push(md(t.options[i].fb)); });
    let ok;
    if (t.dimRule){
      const dims = sel.filter(i => t.options[i].ok === "dim").length;
      ok = !wrongSel.length && sel.length === t.exact && dims <= t.dimRule;
      if (!wrongSel.length && dims > t.dimRule) msgs.push("Height, width and resolution together can only get **2** marks. Swap one for a different piece of metadata.");
      else if (!wrongSel.length && sel.length !== t.exact) msgs.push("Choose exactly **" + t.exact + "**.");
    } else {
      const need = t.options.map((o, i) => isOk(o) ? i : -1).filter(i => i >= 0);
      const missing = need.filter(i => !sel.includes(i));
      ok = !wrongSel.length && !missing.length;
      if (!wrongSel.length && missing.length) msgs.push(missing.length === 1 ? "You're missing **one** correct answer." : "You're missing **" + missing.length + "** correct answers.");
    }
    if (ok){
      sel.forEach(i => labs()[i].classList.add("right"));
      success(ctx, box, "<p>" + (t.exact ? "Those " + t.exact + " would get full marks." : "You found them all.") + "</p>");
    } else {
      attempt(ctx);
      showMsg(box, "bad", "Not yet", msgs.map(m => "<p>" + m + "</p>").join(""));
    }
    hints.update();
  }
  checkRow(card, check, hints);
  card.append(hints.node, box);
  if (isDone(t.id)) showMsg(box, "ok", "Done", "<p>This task is complete.</p>");
}

/* ---------- match (dropdowns) ---------- */
function taskMatch(card, ctx){
  const t = ctx.t, r = ts(t.id);

/* ---------- gap fill ---------- */
function taskGap(card, ctx){
  const t = ctx.t, r = ts(t.id);
  r.gapv = r.gapv || [];
  promptBits(card, t);
  const pre = el(t.prose ? "p" : "pre", { class: t.prose ? "gapprose" : "code gapcode" });
  const inputs = [];
  t.code.split(/(\[\[\d+\]\])/).forEach(part => {
    const m = part.match(/^\[\[(\d+)\]\]$/);
    if (m){
      const gi = +m[1], g = t.gaps[gi];
      const inp = el("input", { type:"text", size: g.w || 4, "aria-label": "Gap " + (gi+1), autocomplete:"off", autocapitalize:"off", spellcheck:"false" });
      inp.value = r.gapv[gi] || "";
      inp.addEventListener("input", ()=>{ r.gapv[gi] = inp.value; inp.classList.remove("bad","good"); save(); });
      inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
      inputs[gi] = inp; pre.append(inp);
    } else if (t.prose) pre.append(document.createTextNode(part));
    else { const sp = el("span"); sp.innerHTML = hl(part); pre.append(sp); }
  });
  card.append(pre);
  const box = fbBox();
  const hints = hintArea(ctx, ()=>{ t.gaps.forEach((g, i) => { inputs[i].value = g.accept[0]; r.gapv[i] = g.accept[0]; inputs[i].classList.add("good"); }); save();
    showMsg(box, "info", "Here is the answer", "<p>Read it through, then cover it and try to write it from memory.</p>"); });
  function check(){
    let bad = [];
    t.gaps.forEach((g, i) => {
      const ok = g.accept.some(a => normGap(a, g.ci) === normGap(inputs[i].value, g.ci));
      inputs[i].classList.toggle("good", ok); inputs[i].classList.toggle("bad", !ok);
      if (!ok) bad.push(i+1);
    });
    if (!bad.length) success(ctx, box, t.output ? "<p>" + esc(t.outputNote || "") + "</p>" : "<p>Every gap is right.</p>", t.output ? outBlock(t.output) : null);
    else {
      attempt(ctx);
      const empty = bad.filter(i => !inputs[i-1].value.trim());
      showMsg(box, "bad", "Not yet", "<p>" + (bad.length === 1 ? "One gap isn't right yet." : bad.length + " gaps aren't right yet.") + (empty.length ? " Fill in every gap." : "") + " The dashed boxes need another look.</p>");
    }
    hints.update();
  }
  checkRow(card, check, hints);
  card.append(hints.node, box);
  if (isDone(t.id)){ inputs.forEach(i => i.classList.add("good")); showMsg(box, "ok", "Done", "<p>This task is complete.</p>"); }
}

/* ---------- parsons ---------- */
function taskParsons(card, ctx){
  const t = ctx.t, r = ts(t.id);
  if (!r.order || r.order.length !== t.lines.length) r.order = t.start.slice();
  if (!r.indent) r.indent = t.lines.map(() => 0);
  promptBits(card, t);
  if (t.output) card.append(el("div", { class:"expected" }, el("p", { class:"lbl" }, "The program should print:"), expBlock(t.output)));
  if (t.given) card.append(el("p", { class:"lbl" }, "Already at the top of the program"), codeBlock(t.given));
  const ul = el("ol", { class:"parsons", "aria-label":"Program lines" });
  card.append(el("p", { class:"lbl" }, "Your lines"), ul);
  function draw(){
    ul.innerHTML = "";
    r.order.forEach((li, pos) => {
      const ind = r.indent[li];
      const line = el("span", { class:"pline" });
      if (ind) line.append(el("span", { class:"ind", style:"width:" + (ind*2.4) + "em" }));
      const code = el("span"); code.innerHTML = hl(t.lines[li][0]); line.append(code);
      const ctl = el("span", { class:"ctl" },
        el("button", { "aria-label":"Move line up", disabled: pos === 0, onclick: ()=>move(pos, pos-1) }, "▲"),
        el("button", { "aria-label":"Move line down", disabled: pos === r.order.length-1, onclick: ()=>move(pos, pos+1) }, "▼"),
        el("button", { "aria-label":"Indent less", disabled: ind === 0, onclick: ()=>{ r.indent[li] = Math.max(0, ind-1); changed(); } }, "←"),
        el("button", { "aria-label":"Indent more", disabled: ind >= 2, onclick: ()=>{ r.indent[li] = Math.min(2, ind+1); changed(); } }, "→"));
      ul.append(el("li", null, line, ctl));
    });
  }
  function move(a, b){ const [x] = r.order.splice(a, 1); r.order.splice(b, 0, x); changed(b); }
  function changed(focusPos){
    save(); draw(); box.innerHTML = "";
    if (focusPos != null){ const btns = ul.children[focusPos] && ul.children[focusPos].querySelectorAll("button"); if (btns && btns.length){ (btns[0].disabled ? btns[1] : btns[0]).focus(); } }
  }
  const box = fbBox();
  const hints = hintArea(ctx, ()=>{ r.order = t.solutions[0].slice(); r.indent = t.lines.map(l => l[1]); save(); draw(); showMsg(box, "info", "Here is the answer", "<p>Notice which lines are indented, and why.</p>"); });
  function check(){
    const sol = t.solutions.find(s => s.every((v, i) => v === r.order[i]));
    const indOK = t.lines.every((l, i) => r.indent[i] === l[1]);
    if (sol && indOK) success(ctx, box, "<p>That's the nesting, the total and the average, all in the right place.</p>");
    else {
      attempt(ctx);
      if (sol) showMsg(box, "bad", "Nearly", "<p>The <strong>order</strong> is right. Now check the <strong>indentation</strong>: what is inside each loop, and what happens after both loops?</p>");
      else { const best = Math.max(...t.solutions.map(s => s.filter((v, i) => v === r.order[i]).length)); showMsg(box, "bad", "Not yet", "<p>" + best + " of " + t.lines.length + " lines are in the right place.</p>"); }
    }
    hints.update();
  }
  draw();
  checkRow(card, check, hints);
  card.append(hints.node, box);
  if (isDone(t.id)) showMsg(box, "ok", "Done", "<p>This task is complete.</p>");
}

/* ---------- fill-in table (truth table) ---------- */
function cellOK(given, accept){
  const v = String(given).trim().replace(/^["']|["']$/g, "").replace(/["']/g, "");
  const a = String(accept);
  if (v.toLowerCase() === a.toLowerCase()) return "ok";
  if (v.replace(/\s+/g, "").toLowerCase() === a.replace(/\s+/g, "").toLowerCase() && a !== "") return "space";
  return "no";
}
function taskTable(card, ctx){
  const t = ctx.t, r = ts(t.id);
  r.cells = r.cells || {};
  promptBits(card, t);
  const table = el("table", { class:"trace" });
  table.append(el("thead", null, el("tr", null, t.columns.map(c => el("th", { scope:"col" }, c)))));
  const tb = el("tbody"), inputs = [];
  t.rows.forEach((row, ri) => {
    const tr = el("tr");
    row.forEach((v, ci) => {
      if (!t.blanks.includes(ci)) tr.append(el("td", { class:"given" }, v));
      else {
        const key = ri + "-" + ci;
        const inp = el("input", { type:"text", class:"sm", "aria-label": t.columns[ci] + " row " + (ri+1), autocomplete:"off" });
        inp.value = r.cells[key] || "";
        inp.addEventListener("input", ()=>{ r.cells[key] = inp.value; inp.classList.remove("bad","good"); save(); });
        inputs.push({ inp, accept: v, key }); tr.append(el("td", null, inp));
      }
    });
    tb.append(tr);
  });
  table.append(tb); card.append(table);
  const box = fbBox();
  const hints = hintArea(ctx, ()=>{ inputs.forEach(x => { x.inp.value = x.accept; r.cells[x.key] = x.accept; x.inp.classList.add("good"); }); save(); showMsg(box, "info", "Here is the completed table", "<p>Check each row against the expression.</p>"); });
  function check(){
    let bad = 0;
    inputs.forEach(x => { const ok = cellOK(x.inp.value, x.accept) === "ok"; x.inp.classList.toggle("good", ok); x.inp.classList.toggle("bad", !ok); if (!ok) bad++; });
    if (!bad) success(ctx, box, "<p>All " + t.rows.length + " rows correct.</p>");
    else { attempt(ctx); showMsg(box, "bad", "Not yet", "<p>" + bad + (bad === 1 ? " box needs" : " boxes need") + " another look.</p>"); }
    hints.update();
  }
  checkRow(card, check, hints);
  card.append(hints.node, box);
  if (isDone(t.id)){ inputs.forEach(x => x.inp.classList.add("good")); showMsg(box, "ok", "Done", "<p>This task is complete.</p>"); }
}

/* ---------- exam-style trace table ---------- */
function taskTrace2(card, ctx){
  const t = ctx.t, r = ts(t.id);
  r.cells = r.cells || {};
  promptBits(card, t);
  const tw = el("div", { class:"stack" });
  const table = el("table", { class:"trace exam" });
  table.append(el("thead", null, el("tr", null, t.columns.map(c => el("th", { scope:"col" }, c)))));
  const tb = el("tbody"), inputs = [];
  t.rows.forEach((row, ri) => {
    const tr = el("tr");
    row.forEach((cell, ci) => {
      if (cell[1]) tr.append(el("td", { class:"given" }, cell[0]));

/* ---------- SQL (tiny built-in engine: SELECT … FROM … WHERE …) ---------- */
function runSQL(q, table){

  let i = 0; const up = () => (toks[i] || "").toUpperCase();
  if (up() !== "SELECT") return { error: "A query starts with SELECT" }; i++;
  const colIdx = name => table.cols.findIndex(c => c.toLowerCase() === String(name).toLowerCase());
  let cols = [];
  if (toks[i] === "*"){ cols = table.cols.map((c, k) => k); i++; }
  else {
    while (true){ const k = colIdx(toks[i]); if (k < 0) return { error: toks[i] ? "There is no field called " + toks[i] : "Which fields? Put them after SELECT" }; cols.push(k); i++; if (toks[i] === ","){ i++; continue; } break; }
  }
  if (up() !== "FROM") return { error: "Expected FROM after the fields" }; i++;
  if ((toks[i] || "").toLowerCase() !== table.name.toLowerCase()) return { error: "There is no table called " + (toks[i] || "(missing)") }; i++;
  let cond = () => true;
  if (up() === "WHERE"){
    i++;
    const atom = () => {
      const k = colIdx(toks[i]); if (k < 0) return { error: "There is no field called " + toks[i] }; i++;
      const op = toks[i]; if (!["=","!=","<>","<",">","<=",">="].includes(op)) return { error: "Expected a comparison like > or = after " + table.cols[k] }; i++;
      let v = toks[i]; if (v == null) return { error: "Missing a value to compare with" }; i++;
      if (/^["']/.test(v)) v = v.slice(1, -1); else if (/^-?\d/.test(v)) v = +v; else return { error: "Text values need quotes, e.g. \"Red\"" };
      return { f: row => { const a = row[k]; const x = typeof a === "number" ? +v : String(v).toLowerCase(), y = typeof a === "number" ? a : String(a).toLowerCase();

    };

  return { cols: cols.map(k => table.cols[k]), rows: idx.map(k => cols.map(c => table.rows[k][c])), idx };
}

/* ---------- code editor ---------- */
function makeEditor(initial, onChange){
  const wrap = el("div", { class:"editor" });
  const gutter = el("div", { class:"gutter", "aria-hidden":"true" });
  const ta = el("textarea", { spellcheck:"false", autocapitalize:"off", autocomplete:"off", autocorrect:"off", "aria-label":"Code editor", wrap:"off" });
  ta.value = initial;
  wrap.append(gutter, ta);
  let errLine = null;
  function size(){
    const n = ta.value.split("\n").length;
    ta.rows = Math.max(6, n + 1);
    let g = ""; for (let i = 1; i <= Math.max(n, ta.rows); i++) g += (i === errLine ? '<span class="errline">'+i+'</span>' : i) + "\n";
    gutter.innerHTML = g;
  }
  function insert(s){
    ta.focus();
    let ok = false; try { ok = document.execCommand("insertText", false, s); } catch(e){}
    if (!ok){ ta.setRangeText(s, ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
  }
  ta.addEventListener("keydown", e => {
    const v = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
    const lineStart = v.lastIndexOf("\n", a-1) + 1;
    const lineBefore = v.slice(lineStart, a);
    if (e.key === "Tab" && !e.ctrlKey && !e.altKey && !e.metaKey){
      if (e.shiftKey){
        e.preventDefault();
        const m = v.slice(lineStart).match(/^ {1,4}/);
        if (m){ ta.setSelectionRange(lineStart, lineStart + m[0].length); insert(""); ta.setSelectionRange(Math.max(lineStart, a - m[0].length), Math.max(lineStart, b - m[0].length)); }
      } else if (a === b){ e.preventDefault(); insert("    ".slice((lineBefore.length) % 4)); }
      else { e.preventDefault(); insert("    "); }
    } else if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey){
      e.preventDefault();
      let ind = (lineBefore.match(/^ */) || [""])[0];
      if (/:\s*$/.test(lineBefore)) ind += "    ";
      insert("\n" + ind);
    } else if (e.key === "Backspace" && a === b && a > lineStart && /^ +$/.test(lineBefore) && lineBefore.length % 4 === 0){

    }
  });
  ta.addEventListener("input", ()=>{ errLine = null; size(); onChange && onChange(ta.value); });
  ta.addEventListener("scroll", ()=>{ gutter.scrollTop = ta.scrollTop; });
  size();
  return { node: wrap, get value(){ return ta.value; }, set value(v){ ta.value = v; errLine = null; size(); onChange && onChange(v); }, markLine(n){ errLine = n; size(); }, focus(){ ta.focus(); } };
}

  } else card.append(el("p", { class:"lbl" }, "Your Python code"), ed.node);
  const runBtn = el("button", { class:"btn" }, "▶ Run");
  const checkBtn = el("button", { class:"btn primary" }, "✓ Check");
  const resetBtn = el("button", { class:"btn quiet" }, "Reset code");
  const actionRow = el("div", { class:"btnrow" }, runBtn, checkBtn);
  card.append(actionRow);
  const pasteWrap = el("div", { class:"paste", hidden: true });
  const pasteTa = el("textarea", { "aria-label":"Output from Thonny", spellcheck:"false" });
  pasteTa.value = r.pasted || "";
  pasteTa.addEventListener("input", ()=>{ r.pasted = pasteTa.value; save(); });
  pasteWrap.append(el("p", { class:"lbl" }, "Paste what your program printed in Thonny:"), pasteTa);
  card.append(pasteWrap);
  const outLbl = el("p", { class:"lbl" }, "Output");
  const outWrap = el("div", { class:"outwrap" }, outLbl);
  const outPre = outBlock(""); outPre.textContent = "Press Run to see what your code prints."; outPre.classList.add("empty");
  outWrap.append(outPre); card.append(outWrap);
  const box = fbBox();
  const solWrap = el("div", { class:"solution" });
  const hints = hintArea(ctx, ()=>{
    solWrap.innerHTML = "";
    solWrap.append(el("p", { class:"lbl" }, "A model answer"), codeBlock(t.solution),
      el("div", { class:"btnrow" }, el("button", { class:"btn", onclick: ()=>{ ed.value = t.solution; ed.focus(); } }, "Put it in the editor")));
    box.innerHTML = "";
  });
  actionRow.append(...hints.buttons, resetBtn);
  card.append(hints.node, box, solWrap);
  function modeUpdate(){
    const off = PY.status === "offline", loading = PY.status === "loading" || PY.status === "idle";
    runBtn.hidden = off; outWrap.hidden = off; pasteWrap.hidden = !off;
    runBtn.disabled = loading; checkBtn.disabled = loading;
    offNote.hidden = !(off || loading);
    if (off){ offNote.innerHTML = md("Python couldn't load on this computer. **Copy your code into Thonny**" + (t.harness ? " (with the extra lines above at the end)" : "") + ", run it there, then paste what it printed into the box below and press **Check**. ") + (usesInput ? md("When it asks, type ") + inputList(tests[0].inputs) + ". " : "");
      offNote.append(el("button", { class:"btn quiet", onclick: startPy }, "Try loading Python again")); }
    else if (loading) offNote.innerHTML = md("Python is **loading**… Run and Check will work in a moment.");
  }
  modeUpdate();
  document.addEventListener("pystatus", modeUpdate);
  const obs = new MutationObserver(()=>{ if (!document.body.contains(card)){ document.removeEventListener("pystatus", modeUpdate); obs.disconnect(); } });
  obs.observe($("main"), { childList:true });
  function boxInputs(){ const L = inTa.value.replace(/\r/g, "").split("\n"); while (L.length && L[L.length-1] === "") L.pop(); return L; }
  async function execute(inputs, label){
    runBtn.disabled = checkBtn.disabled = true;
    outLbl.textContent = label || "Output";
    outPre.className = "out empty"; outPre.textContent = "Running…";
    const res = await runPy(full(ed.value), inputs);
    runBtn.disabled = checkBtn.disabled = PY.status !== "ready";
    if (res.offline){ modeUpdate(); return null; }
    if (res.timeout){ outPre.className = "out"; outPre.textContent = "(stopped)"; return { kind:"timeout" }; }
    outPre.className = "out" + (res.out ? "" : " empty");
    outPre.textContent = res.out || "(nothing printed)";
    if (res.tooMuch) return { kind:"toomuch" };
    if (!res.ok){
      const ex = explainError(res.err, ed.value); if (ex.lineNo) ed.markLine(ex.lineNo);
      if (/NO_MORE_INPUT/.test(res.err)){ outPre.textContent = (res.out || "").replace(/\n$/, "") + "\n(no more input)"; outPre.className = "out"; return { kind:"noinput", ex }; }
      outPre.textContent = (res.out || "") + (res.out ? "\n" : "") + ex.last; outPre.className = "out"; return { kind:"error", ex };
    }
    return { kind:"ok", out: res.out };
  }
  function errorMsg(res, checking){
    if (res.kind === "timeout") showMsg(box, "bad", "Your program ran for ever", "<p>It ran for more than 6 seconds and was stopped. That usually means an <strong>infinite loop</strong>: are the inputs asked again <strong>inside</strong> the loop? Python is restarting, which takes a few seconds.</p>");
    else if (res.kind === "toomuch") showMsg(box, "bad", "Too much output", "<p>Your program printed a huge amount, so it was stopped. Is your loop running <strong>for ever</strong>?</p>");
    else if (res.kind === "noinput") showMsg(box, "bad", "Your program wanted more input", "<p>" + (checking ? md("Your program kept asking after the last input. Check that it **stops** when 0 is entered.") : md("Your program asked for more input than there is in the **Inputs** box.")) + "</p>");
    else if (res.kind === "error") showMsg(box, "bad", "Python found an error" + (res.ex.lineNo ? " on line " + res.ex.lineNo : ""), "<p>" + md(res.ex.friendly) + "</p><p class='raw'>" + esc(res.ex.last) + "</p>");
  }
  function testLabel(x){ return x.inputs.length ? "Output, when the user types " + x.inputs.join(", ") : "Output"; }
  runBtn.onclick = async () => { box.innerHTML = ""; const inp = boxInputs(); const res = await execute(inp, usesInput ? testLabel({ inputs: inp }) : "Output"); if (res && res.kind !== "ok") errorMsg(res, false); };
  resetBtn.onclick = () => { if (ed.value === t.starter || confirm("Put the starting code back? Your changes will be lost.")){ ed.value = t.starter; box.innerHTML = ""; } };
  checkBtn.onclick = async () => {
    const code = ed.value;
    let results = [];
    for (const f of (t.forbid || [])) if (new RegExp(f.re).test(code)){ attempt(ctx); showMsg(box, "info", "Try another way", "<p>" + md(f.msg) + "</p>"); hints.update(); return; }
    if (PY.status === "offline"){
      if (!pasteTa.value.trim()){ showMsg(box, "bad", "Nothing pasted yet", "<p>Run your code in Thonny, then copy what it printed into the box above.</p>"); return; }
      results = [{ test: tests[0], out: pasteTa.value }];
    } else {
      for (const x of tests){
        const res = await execute(x.inputs, testLabel(x));
        if (!res) return;
        if (res.kind !== "ok"){ attempt(ctx); errorMsg(res, true); if (x.inputs.length) box.querySelector(".msg").append(el("p", { html: "This happened when the user typed " + inputList(x.inputs) + "." })); hints.update(); return; }
        results.push({ test: x, out: res.out });
        if (!sameOut(x.expected, res.out)) break;
      }
    }
    if (printUsesComma(code)){ showMsg(box, "info", "Use + to join, not commas", "<p>" + md("In our lessons we join the parts of a print with **+**, not commas. Put spaces **inside the quotes**, and turn numbers into text with **str()**: `print(\"Price: £\" + str(price))`") + "</p>"); return; }
    const fail = results.find(x => !sameOut(x.test.expected, x.out));
    if (!fail){
      const missing = (t.require || []).find(q => !new RegExp(q.re).test(code));
      if (missing){ showMsg(box, "info", "Right output, but…", "<p>" + md(missing.msg) + "</p>"); return; }
      success(ctx, box, "<p>" + (tests.length > 1 && PY.status !== "offline" ? "Your program passed all " + tests.length + " tests." : "Your output matches exactly.") + "</p>");
      hints.update(); return;
    }
    attempt(ctx);
    const exp = normLines(fail.test.expected), got = normLines(fail.out);
    const which = fail.test.inputs.length ? "<p>" + (tests.length > 1 ? "Test " + (tests.indexOf(fail.test) + 1) + " of " + tests.length + ": " : "") + "the user typed " + inputList(fail.test.inputs) + ".</p>" : "";
    showMsg(box, "bad", "Not quite", which + "<p>" + diffSummary(exp, got) + "</p>", diffView(exp, got));
    hints.update();
  };
  if (isDone(t.id)) showMsg(box, "ok", "Done", "<p>This task is complete. You can still run and change your code.</p>");
}
function sameOut(expected, out){ const a = normLines(expected), b = normLines(out); return a.length === b.length && a.every((l, i) => l === b[i]); }
function printUsesComma(code){
  const src = code.replace(/#.*$/gm, "").replace(/"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'/g, '""');
  const re = /\bprint\s*\(/g; let m;
  while ((m = re.exec(src))){
    let depth = 1;
    for (let i = m.index + m[0].length; i < src.length && depth > 0; i++){
      const c = src[i];
      if (c === "(" || c === "[") depth++; else if (c === ")" || c === "]") depth--; else if (c === "," && depth === 1) return true;
    }
  }
  return false;
}
function diffSummary(exp, got){
  if (!got.length) return "Your program didn't print anything.";
  const squash = L => L.map(l => l.replace(/\s+/g, ""));
  if (exp.length === got.length && squash(exp).every((l, i) => l === squash(got)[i])) return "Nearly! Only the <strong>spaces</strong> are different. Check for a space <strong>inside the quotes</strong>, next to each +.";
  for (let i = 0; i < Math.max(exp.length, got.length); i++){
    if (exp[i] !== got[i]){
      if (i >= got.length) return "Your output stops too early: line " + (i+1) + " is missing.";
      if (i >= exp.length) return "Your program prints <strong>too many lines</strong>. Line " + (i+1) + " shouldn't be there.";
      return "Line " + (i+1) + " is different. Compare the two outputs below.";
    }
  }
  return "Compare the two outputs below.";
}
function diffView(exp, got){
  const d = el("div", { class:"diff" });
  const a = el("pre"), b = el("pre");
  let first = -1; for (let i = 0; i < Math.max(exp.length, got.length); i++) if (exp[i] !== got[i]){ first = i; break; }
  a.innerHTML = exp.map((l, i) => i === first ? "<mark>" + esc(l || " ") + "</mark>" : esc(l)).join("\n");
  b.innerHTML = got.map((l, i) => i === first ? "<mark>" + esc(l || " ") + "</mark>" : esc(l)).join("\n") || "(nothing)";
  if (first >= got.length && first >= 0) b.innerHTML += "\n<mark>(missing)</mark>";
  d.append(el("div", null, el("p", { class:"lbl" }, "Should print"), a), el("div", null, el("p", { class:"lbl" }, "Your program printed"), b));
  return d;
}

/* ---------- extended writing ---------- */
function taskEssay(card, ctx){
  const t = ctx.t, r = ts(t.id);
  card.append(el("p", { class:"prompt", html: md(t.prompt) }));
  card.append(el("div", { class:"examq" }, el("p", { html: md(t.question) })));
  const ta = el("textarea", { class:"essay", "aria-label":"Your answer", spellcheck:"true" });
  ta.value = r.text != null ? r.text : t.frame;
  ta.addEventListener("input", ()=>{ r.text = ta.value; save(); });
  card.append(el("p", { class:"lbl" }, "Your answer (the headings are there to help: keep them)"), ta);
  r.ticks = r.ticks || [];
  const ticks = t.checklist.map((c, i) => {
    const cb = el("input", { type:"checkbox", id: t.id + "-k" + i }); cb.checked = !!r.ticks[i];
    cb.addEventListener("change", ()=>{ r.ticks[i] = cb.checked; save(); });
    return el("label", { class:"check", for: t.id + "-k" + i }, cb, el("span", { html: md(c) }));
  });
  card.append(el("p", { class:"lbl" }, "Mark it: tick each one that is true"), el("div", { class:"checks" }, ticks));
  const lv = el("div", { class:"levels", role:"radiogroup", "aria-label":"Level" });
  t.levels.forEach((L, i) => {
    const rb = el("input", { type:"radio", name: t.id + "-lv", id: t.id + "-lv" + i, value: String(i+1) }); rb.checked = r.level === i+1;
    rb.addEventListener("change", ()=>{ r.level = i+1; save(); });
    lv.append(el("label", { class:"lvl", for: t.id + "-lv" + i }, rb, el("b", null, L[0] + " marks"), el("span", null, L[1])));
  });
  card.append(el("p", { class:"lbl" }, "Which level do you think it reaches?"), lv);
  const box = fbBox();
  card.append(el("div", { class:"btnrow" }, el("button", { class:"btn primary", onclick: ()=>{
    const words = (ta.value.replace(t.frame, "").match(/[A-Za-z']+/g) || []).length;
    const ticked = t.checklist.filter((c, i) => r.ticks[i]).length;
    if (words < 80){ showMsg(box, "bad", "Keep writing", "<p>Your answer has about " + words + " words. An 8-mark answer usually needs at least 150, with every point explained.</p>"); return; }
    if (!r.level){ showMsg(box, "bad", "Choose a level", "<p>Pick the level you think your answer reaches.</p>"); return; }
    if (ticked < t.checklist.length){ attempt(ctx); }
    r.words = words; save();
    success(ctx, box, "<p>" + (ticked < t.checklist.length ? "You left " + (t.checklist.length - ticked) + " checklist item" + (t.checklist.length - ticked === 1 ? "" : "s") + " unticked. Improve those parts, then tick them. " : "Every checklist item is ticked. ") + "Your teacher will see the level you chose.</p>");
  } }, "Save my answer")), box);
  if (isDone(t.id)) showMsg(box, "ok", "Saved", "<p>You can keep improving it: your changes are saved as you type.</p>");
}

/* ---------- completion code ---------- */
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function partStatus(p, i){
  if (ME.m[i] >= p.max) return 7;
  const own = p.tasks.find(t => t.role === "own"), help = p.tasks.find(t => t.role === "help");
  const o = state.tasks[own.id] || {};
  if (o.revealed) return 4;
  if (o.status === "done") return (o.attempts || 0) > 0 || (o.hints || 0) > 0 ? 3 : 2;
  if (help && isDone(help.id)) return 1;
  return 0;
}
function completionCode(){
  let bits = 0n;
  PARTS.forEach((p, i) => { bits = (bits << 3n) | BigInt(partStatus(p, i)); });
  const ess = state.tasks["10-o"] || {};
  bits = (bits << 2n) | BigInt(ess.status === "done" ? (ess.level || 0) : 0);
  const day = Math.max(0, Math.min(1023, Math.floor((Date.now() - Date.UTC(2026, 10, 1)) / 86400000)));
  bits = (bits << 10n) | BigInt(day);
  const chk = cyrb53(CODE + bits.toString(36) + SALT) % 1024;
  bits = (bits << 10n) | BigInt(chk);
  let s = ""; const n = 21;
  for (let i = 0; i < n; i++){ s = B32[Number(bits & 31n)] + s; bits >>= 5n; }
  return CODE + "-" + s.match(/.{1,7}/g).join("-");
}
function renderFinish(main){
  main.append(el("div", { class:"sechead" }, el("div", null, el("p", { class:"kicker" }, "Finish and hand in"), el("h1", { class:"title" }, "Your completion code")), modeChip()));
  const code = completionCode();
  const codeEl = el("p", { class:"ccode" }, code);
  const copyBtn = el("button", { class:"btn primary", onclick: async ()=>{ try { await navigator.clipboard.writeText(code); copyBtn.textContent = "Copied ✓"; } catch(e){ const rg = document.createRange(); rg.selectNodeContents(codeEl); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); copyBtn.textContent = "Selected: press Ctrl+C"; } } }, "Copy code");
  main.append(el("div", { class:"card" },
    el("h2", null, "Copy this code into your Teams assignment"),
    codeEl, el("div", { class:"btnrow" }, copyBtn),
    el("p", { class:"inote" }, "It tells your teacher which questions you've practised and how they went. If you do more later, come back and hand in the new code.")));
  const coreDone = CORE.filter(x => isDone(x.t.id)).length;
  const tb = el("tbody");
  SECTIONS.forEach((s, si) => {
    const i = PARTS.indexOf(s.part), st = partStatus(s.part, i);
    const label = ["Not started","Help task done","On your own: first try ✓","On your own: done ✓","Answer shown"][st];
    tb.append(el("tr", null, el("td", null, s.part.q + " " + s.title), el("td", null, label)));
  });
  main.append(el("div", { class:"bigstat" }, el("div", null, el("b", null, coreDone + "/" + CORE.length), "tasks done")));
  main.append(el("table", { class:"summary" }, el("thead", null, el("tr", null, el("th", null, "Question"), el("th", null, "Progress"))), tb));
  const firstGap = CORE.find(x => !isDone(x.t.id));
  const row = el("div", { class:"btnrow" });
  if (firstGap) row.append(el("button", { class:"btn", onclick: ()=>go(firstGap.s.id, firstGap.ti) }, "Go to your first unfinished task"));
  row.append(el("button", { class:"btn quiet", onclick: ()=>{ if (confirm("Clear all your answers on this computer and start again?")){ state = { tasks:{}, view:{ page:"intro", task:0 } }; try{ localStorage.removeItem(STORE_KEY); }catch(e){} render(); } } }, "Start again"));
  main.append(row);
  main.append(el("p", { class:"stamp" }, "Progress is saved in this browser only. Use the same computer and browser to carry on."));
}

/* ---------- login ---------- */
function renderLogin(){
  document.body.classList.add("loggedout");
  const main = $("main"); main.innerHTML = "";
  const inp = el("input", { type:"text", id:"codein", maxlength:"3", autocomplete:"off", autocapitalize:"characters", spellcheck:"false", "aria-describedby":"codehelp" });
  const box = fbBox();
  const goBtn = el("button", { class:"btn primary" }, "Open my feedback →");
  function attemptLogin(){
    const v = inp.value.trim().toUpperCase();
    if (v.length !== 3){ showMsg(box, "bad", "Three characters", "<p>Your code has 3 characters, like <code>K7Q</code>. It's on your feedback sheet.</p>"); return; }
    if (!login(v)){ showMsg(box, "bad", "Code not found", "<p>Check it against your feedback sheet. Letters and a number, e.g. <code>K7Q</code>.</p>"); return; }
    document.body.classList.remove("loggedout"); start();
  }
  goBtn.onclick = attemptLogin;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") attemptLogin(); });
  main.append(el("div", { class:"login" },
    el("p", { class:"kicker" }, "GCSE Computer Science · Year 11"),
    el("h1", { class:"title" }, "Winter Assessment feedback"),
    el("div", { class:"card" },
      el("label", { for:"codein", class:"lbl big" }, "Type your 3-character code"),
      el("p", { id:"codehelp", class:"inote" }, "It's at the top of your feedback sheet."),
      el("div", { class:"btnrow" }, inp, goBtn), box)));
  setTimeout(()=>inp.focus(), 50);
}
function start(){
  buildNav();
  render();
  if (needsPy() && PY.status === "idle") startPy();
}
function boot(){
  const fromHash = location.hash.slice(1).toUpperCase();
  let last = null; try { last = localStorage.getItem("bhoa-y11mock-last"); } catch(e){}
  if ((fromHash && login(fromHash)) || (!fromHash && last && login(last))){ document.body.classList.remove("loggedout"); start(); }
  else renderLogin();
}
boot();
window.__app = { get SECTIONS(){ return SECTIONS; }, get state(){ return state; }, PY, runPy, go, completionCode, login, PARTS };
})();
